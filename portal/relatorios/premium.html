/* ---------- exportação para PPT ---------- */
function svgInline(svgEl) {
  const clone = svgEl.cloneNode(true);
  const srcEls = svgEl.querySelectorAll('*'), dstEls = clone.querySelectorAll('*');
  const copy = (src, dst) => { const cs = getComputedStyle(src); ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'font-size', 'font-weight', 'font-family', 'text-anchor'].forEach(p => { const v = cs.getPropertyValue(p); if (v) dst.style.setProperty(p, v); }); };
  copy(svgEl, clone);
  srcEls.forEach((src, i) => copy(src, dstEls[i]));
  return clone;
}
function svgToPng(svgEl, scale) {
  return new Promise((resolve, reject) => {
    const clone = svgInline(svgEl);
    const vb = svgEl.viewBox.baseVal;
    const w = (vb && vb.width) || svgEl.clientWidth || 640, h = (vb && vb.height) || svgEl.clientHeight || 260;
    clone.setAttribute('width', w); clone.setAttribute('height', h);
    const xml = new XMLSerializer().serializeToString(clone);
    const img = new Image();
    img.onload = () => {
      const s = scale || 2, canvas = document.createElement('canvas');
      canvas.width = w * s; canvas.height = h * s;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.scale(s, s); ctx.drawImage(img, 0, 0, w, h);
      resolve({ dataUrl: canvas.toDataURL('image/png'), w, h });
    };
    img.onerror = reject;
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
  });
}
async function chartToPng(chartHtml) {
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-9999px;top:0;background:#fff';
  holder.innerHTML = chartHtml;
  document.body.appendChild(holder);
  const svgEl = holder.querySelector('svg');
  let out = null;
  if (svgEl) { try { out = await svgToPng(svgEl); } catch (e) { console.warn(e); } }
  document.body.removeChild(holder);
  return out;
}
/* celular (principalmente iOS) não baixa blob de forma confiável por <a download>: usa a Web Share
   nativa quando disponível (abre o leque de "salvar em Arquivos"/"compartilhar"); no desktop, cai
   no download clássico de sempre. */
async function saveOrShareFile(blob, fileName, mimeType) {
  try {
    const file = new File([blob], fileName, { type: mimeType });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: fileName }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; /* usuário cancelou o compartilhamento */ }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = fileName; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function imgDataUrl(path) {
  try {
    const r = await fetch(path); if (!r.ok) return null;
    const blob = await r.blob();
    return await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
  } catch (e) { console.warn('logo', e); return null; }
}
/* funde uma imagem (possivelmente com transparência) numa cor de fundo sólida, gerando um PNG opaco.
   Evita depender da opção "transparency" do pptx, que alguns apps (principalmente visualizadores
   mobile) não respeitam direito e acabam mostrando a imagem como se não tivesse carregado. */
function flattenImg(dataUrl, bgHex, alpha) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#' + bgHex; ctx.fillRect(0, 0, c.width, c.height);
      ctx.globalAlpha = alpha == null ? 1 : alpha;
      ctx.drawImage(img, 0, 0);
      resolve(c.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}
async function exportFechamentoPpt(ym, prevYm, st, pv, proj, cnpj) {
  const btn = $('#fch-ppt'); const prevLabel = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Gerando PPT…'; }
  try {
    const pptx = new PptxGenJS();
    pptx.layout = 'LAYOUT_WIDE';
    const W = 13.333, H = 7.5;
    const TH = { ink: '241614', ink2: '5B4743', ink3: '8C7A75', line: 'E8DFD9', brand: '3B1716', accent: 'D4A03F', pos: '5F8268', neg: 'A8655A' };
    const SANS = 'Calibri';
    const CLIENT = 'Premium Pinturas Prediais';
    const logoRaw = await imgDataUrl('../../assets/img/clientes/premium-pinturas.png');
    const logoFull = logoRaw ? await flattenImg(logoRaw, TH.brand) : null;
    const logoDividerImg = logoRaw ? await flattenImg(logoRaw, TH.brand, 0.3) : null;
    const subScope = cnpjName(cnpj);
    let pageNum = 1;
    const BAND_TOP = 1.35, BAND_BOT = H - 0.65;

    const header = (slide, title, subtitle) => {
      slide.addShape('rect', { x: 0, y: 0, w: W, h: 0.09, fill: { color: TH.accent }, line: { type: 'none' } });
      slide.addText(title, { x: 0.6, y: 0.3, w: W - 1.2, h: 0.6, fontSize: 26, bold: true, color: TH.brand, fontFace: 'Georgia' });
      if (subtitle) slide.addText(subtitle, { x: 0.6, y: 0.84, w: W - 1.2, h: 0.32, fontSize: 13, color: TH.ink2, fontFace: SANS });
      slide.addShape('line', { x: 0.6, y: 1.2, w: W - 1.2, h: 0, line: { color: TH.line, width: 1 } });
    };
    const footer = slide => {
      slide.addShape('line', { x: 0.6, y: H - 0.5, w: W - 1.2, h: 0, line: { color: TH.line, width: 0.75 } });
      slide.addText(CLIENT + '   ·   CM Soluções Financeiras   ·   Confidencial', { x: 0.6, y: H - 0.42, w: W - 2, h: 0.3, fontSize: 9, color: TH.ink3, fontFace: SANS });
      slide.addText(String(pageNum), { x: W - 1.1, y: H - 0.42, w: 0.5, h: 0.3, fontSize: 9, color: TH.ink3, fontFace: SANS, align: 'right' });
      pageNum++;
    };
    const newSlide = (title, subtitle) => { const s = pptx.addSlide(); s.background = { color: 'FFFFFF' }; header(s, title, subtitle); return s; };
    const kpiRow = (slide, y, items) => {
      const gap = 0.18, x0 = 0.6, totalW = W - 1.2, n = items.length, cw = (totalW - gap * (n - 1)) / n, h = 1.35;
      items.forEach((it, i) => {
        const x = x0 + i * (cw + gap);
        slide.addShape('roundRect', { x, y, w: cw, h, rectRadius: 0.08, fill: { color: 'FFFFFF' }, line: { color: TH.line, width: 1 } });
        slide.addShape('roundRect', { x: x + 0.14, y: y + 0.12, w: cw - 0.28, h: 0.07, rectRadius: 0.035, fill: { color: it.bar || TH.accent }, line: { type: 'none' } });
        slide.addText(it.label.toUpperCase(), { x: x + 0.22, y: y + 0.3, w: cw - 0.4, h: 0.28, fontSize: 9.5, bold: true, color: TH.ink2, fontFace: SANS, charSpacing: 1 });
        slide.addText(it.value, { x: x + 0.2, y: y + 0.56, w: cw - 0.4, h: 0.5, fontSize: 19, bold: true, color: TH.ink, fontFace: 'Georgia', fit: 'shrink' });
        if (it.note) slide.addText(it.note, { x: x + 0.22, y: y + h - 0.3, w: cw - 0.4, h: 0.26, fontSize: 8.5, color: TH.ink3, fontFace: SANS });
      });
    };
    const divider = (title, subtitle) => {
      const s = pptx.addSlide(); s.background = { color: TH.brand };
      if (logoDividerImg) s.addImage({ data: logoDividerImg, x: W - 2.3, y: H - 2.2, w: 1.6, h: 1.6 });
      s.addShape('rect', { x: 0.8, y: H / 2 - 0.62, w: 1.1, h: 0.055, fill: { color: TH.accent }, line: { type: 'none' } });
      s.addText(title, { x: 0.8, y: H / 2 - 0.5, w: W - 2, h: 1.0, fontSize: 40, bold: true, color: 'FFFFFF', fontFace: 'Georgia' });
      if (subtitle) s.addText(subtitle, { x: 0.8, y: H / 2 + 0.35, w: W - 2, h: 0.5, fontSize: 15, color: 'EAD9CE', fontFace: SANS });
      return s;
    };
    const chartSlide = async (title, subtitle, chartHtml, opt) => {
      opt = opt || {};
      const s = newSlide(title, subtitle);
      const bandBot = opt.caption ? BAND_BOT - 0.4 : BAND_BOT;
      const img = chartHtml ? await chartToPng(chartHtml) : null;
      if (img) {
        const w = opt.w || W - 2.0; let h = w * img.h / img.w; if (h > 4.7) h = 4.7;
        const y = BAND_TOP + Math.max(0, (bandBot - BAND_TOP - h) / 2);
        s.addImage({ data: img.dataUrl, x: (W - w) / 2, y, w, h });
      } else s.addText('Sem dados no mês.', { x: 0.6, y: BAND_TOP, fontSize: 14, color: TH.ink2, fontFace: SANS });
      if (opt.caption) s.addText(opt.caption, { x: 0.6, y: H - 0.95, w: W - 1.2, h: 0.4, fontSize: 11, color: TH.ink2, fontFace: SANS });
      footer(s);
      return s;
    };
    const twoChartSlide = async (title, subtitle, l, r) => {
      const s = newSlide(title, subtitle);
      const halfW = (W - 1.2 - 0.4) / 2;
      s.addText(l.title, { x: 0.6, y: 1.35, w: halfW, h: 0.3, fontSize: 13, bold: true, color: TH.ink2, fontFace: SANS });
      s.addText(r.title, { x: 0.6 + halfW + 0.4, y: 1.35, w: halfW, h: 0.3, fontSize: 13, bold: true, color: TH.ink2, fontFace: SANS });
      const [imgL, imgR] = await Promise.all([l.html ? chartToPng(l.html) : null, r.html ? chartToPng(r.html) : null]);
      if (imgL) s.addImage({ data: imgL.dataUrl, x: 0.6, y: 1.7, w: halfW, h: Math.min(4.4, halfW * imgL.h / imgL.w) });
      else s.addText('Sem dados.', { x: 0.6, y: 1.7, fontSize: 12, color: TH.ink3, fontFace: SANS });
      if (imgR) s.addImage({ data: imgR.dataUrl, x: 0.6 + halfW + 0.4, y: 1.7, w: halfW, h: Math.min(4.4, halfW * imgR.h / imgR.w) });
      else s.addText('Sem dados.', { x: 0.6 + halfW + 0.4, y: 1.7, fontSize: 12, color: TH.ink3, fontFace: SANS });
      footer(s);
      return s;
    };
    const tableSlide = (title, subtitle, cols, rows, opt) => {
      opt = opt || {};
      const s = newSlide(title, subtitle);
      const head = cols.map(c => ({ text: c.l, options: { bold: true, color: 'FFFFFF', fill: { color: TH.brand }, align: c.n ? 'right' : 'left' } }));
      const body = rows.length ? rows.map(r => cols.map(c => ({ text: c.f(r), options: { align: c.n ? 'right' : 'left', color: c.color ? c.color(r) : TH.ink } }))) : [cols.map((c, i) => i === 0 ? { text: 'Sem dados no mês.', options: { color: TH.ink3 } } : { text: '' })];
      const bandBot = opt.caption ? BAND_BOT - 0.4 : BAND_BOT;
      const estH = Math.min(bandBot - BAND_TOP, (rows.length + 1) * 0.32);
      const y = BAND_TOP + Math.max(0, (bandBot - BAND_TOP - estH) / 2);
      s.addTable([head].concat(body), { x: 0.6, y, w: W - 1.2, colW: opt.colW, fontSize: 11, fontFace: SANS, color: TH.ink, border: { type: 'solid', color: TH.line, pt: 0.5 }, autoPage: false, rowH: 0.32 });
      if (opt.caption) s.addText(opt.caption, { x: 0.6, y: H - 0.95, w: W - 1.2, h: 0.4, fontSize: 10, color: TH.ink3, fontFace: SANS });
      footer(s);
      return s;
    };
    const kpiSlide = (title, subtitle, items) => {
      const s = newSlide(title, subtitle);
      const y = BAND_TOP + Math.max(0, (BAND_BOT - BAND_TOP - 1.35) / 2);
      kpiRow(s, y, items); footer(s); return s;
    };

    /* ---------- Capa (bloco maciço na cor da marca, logo é um selo circular) ---------- */
    let s = pptx.addSlide(); s.background = { color: TH.brand };
    if (logoFull) s.addImage({ data: logoFull, x: W / 2 - 1.1, y: 0.85, w: 2.2, h: 2.2 });
    s.addText('Fechamento mensal', { x: 0, y: 3.35, w: W, h: 0.7, fontSize: 32, bold: true, color: 'FFFFFF', fontFace: 'Georgia', align: 'center' });
    s.addText(U.monthLabel(ym) + ' · ' + subScope, { x: 0, y: 4.0, w: W, h: 0.45, fontSize: 16, color: TH.accent, fontFace: SANS, align: 'center' });
    s.addShape('line', { x: W / 2 - 0.7, y: 4.6, w: 1.4, h: 0, line: { color: TH.accent, width: 1.5 } });
    s.addText('Elaborado por CM Soluções Financeiras · ' + U.dt(Date.now()), { x: 0, y: H - 0.7, w: W, h: 0.3, fontSize: 11, color: 'D9C6BC', fontFace: SANS, align: 'center' });

    /* ---------- Resultado do mês ---------- */
    s = newSlide('Resultado do mês', U.monthLabel(ym) + ' · ' + subScope + (proj ? ' · realizado + projeção' : ' · realizado'));
    const variacao = U.r2(st.res - pv.res);
    const saldoCaixa = U.sum(st.saldos.filter(b => b.cash), b => b.calc);
    kpiRow(s, 1.4, [
      { label: 'Recebido', value: U.money(st.rec), note: U.monthLabel(ym), bar: TH.pos },
      { label: 'Pago', value: U.money(st.desp), note: U.monthLabel(ym), bar: TH.neg },
      { label: 'Resultado', value: U.money(st.res), note: (variacao >= 0 ? '+' : '') + U.money(variacao) + ' vs. ' + U.monthLabel(prevYm), bar: TH.accent },
      { label: 'Saldo em caixa', value: U.money(saldoCaixa), note: 'consolidado', bar: TH.brand },
    ]);
    const wfImg = await chartToPng(waterfall(wfStepsBalanco(st, proj), { w: 1040, h: 300 }));
    if (wfImg) { const w = W - 2.6; const h = Math.min(4.0, w * wfImg.h / wfImg.w); s.addImage({ data: wfImg.dataUrl, x: (W - w) / 2, y: 3.05, w, h }); }
    footer(s);

    /* ---------- Evolução ---------- */
    const series6 = monthSeries(data().all, S.settings, ym, 6, cnpj);
    await chartSlide('Evolução do resultado de caixa', 'Últimos 6 meses · ' + subScope, flowChart([
      { name: 'Receita', cls: 'lnrec', points: series6.map(x => ({ l: U.monthLabel(x.ym), v: x.rec })) },
      { name: 'Despesa', cls: 'lndesp', points: series6.map(x => ({ l: U.monthLabel(x.ym), v: x.desp })) },
      { name: 'Resultado', cls: 'lnres', points: series6.map(x => ({ l: U.monthLabel(x.ym), v: x.res })) },
    ], { h: 260 }), { caption: 'Evita julgar o mês isolado: mostra se o resultado deste mês é uma oscilação ou uma tendência.' });

    const chartOpt = { valueWidth: 170, w: 1040, labelWidth: 260, rowH: 42 };

    /* ---------- Receitas ---------- */
    divider('Receitas', U.monthLabel(ym) + ' · ' + subScope);
    await chartSlide('Receitas por categoria', U.monthLabel(ym) + ' · realizado', st.porCatReceita.length ? hbar2(st.porCatReceita.slice(0, 10).map(x => ({ label: x.k, value: x.v, extra: x.n + ' lanç.', cls: 'wfpos' })), chartOpt) : null);
    tableSlide('Receitas por categoria · detalhado', U.monthLabel(ym) + ' × ' + U.monthLabel(prevYm), [
      { l: 'Categoria', f: r => r.k },
      { l: 'Este mês', n: true, f: r => U.money(r.cur) },
      { l: 'Mês anterior', n: true, f: r => U.money(r.prev) },
      { l: 'Variação', n: true, f: r => U.money(r.cur - r.prev, { sign: 1 }), color: r => r.cur - r.prev < 0 ? TH.neg : TH.pos },
    ], compareCat(st.porCatReceita, pv.porCatReceita).slice(0, 12), { colW: [5.5, 2.2, 2.2, 2.2] });
    const porObraRec = groupSum(st.real.filter(x => x.k === 'receita'), x => x.centroCusto || '(sem obra/centro)');
    await chartSlide('Receitas por obra / centro de custo', U.monthLabel(ym), porObraRec.length ? hbar2(porObraRec.slice(0, 10).map(x => ({ label: x.k, value: x.v, extra: x.n + ' lanç.', cls: 'wfpos' })), chartOpt) : null);
    const porCliente = porPessoa(st.real, 'receita');
    await chartSlide('Receitas por cliente', U.monthLabel(ym), porCliente.length ? hbar2(porCliente.slice(0, 10).map(x => ({ label: x.k, value: x.v, extra: x.n + ' lanç.', cls: 'wfpos' })), chartOpt) : null);
    tableSlide('Receitas por cliente · detalhado', U.monthLabel(ym), [
      { l: 'Cliente', f: r => r.k },
      { l: 'Lanç.', n: true, f: r => String(r.n) },
      { l: 'Valor', n: true, f: r => U.money(r.v) },
      { l: '%', n: true, f: r => U.pct(st.rec ? r.v / st.rec : 0) },
    ], porCliente.slice(0, 14), { colW: [6, 2, 2.3, 1.8] });

    /* ---------- Despesas ---------- */
    divider('Despesas', U.monthLabel(ym) + ' · ' + subScope);
    await chartSlide('Despesas por categoria', U.monthLabel(ym) + ' · realizado', st.porCat.length ? hbar2(st.porCat.slice(0, 10).map(x => ({ label: x.k, value: x.v, extra: x.n + ' lanç.', cls: 'wfneg' })), chartOpt) : null);
    tableSlide('Despesas por categoria · detalhado', U.monthLabel(ym) + ' × ' + U.monthLabel(prevYm), [
      { l: 'Categoria', f: r => r.k },
      { l: 'Este mês', n: true, f: r => U.money(r.cur) },
      { l: 'Mês anterior', n: true, f: r => U.money(r.prev) },
      { l: 'Variação', n: true, f: r => U.money(r.cur - r.prev, { sign: 1 }), color: r => r.cur - r.prev > 0 ? TH.neg : TH.pos },
    ], compareCat(st.porCat, pv.porCat).slice(0, 12), { colW: [5.5, 2.2, 2.2, 2.2] });
    const porGrupoDesp = groupSum(st.real.filter(x => x.k === 'despesa'), costGroup);
    await chartSlide('Despesas por grupo de custo', U.monthLabel(ym), porGrupoDesp.length ? hbar2(porGrupoDesp.map(x => ({ label: x.k, value: x.v, extra: x.n + ' lanç.', cls: 'wfneg' })), chartOpt) : null, { caption: 'Materiais, mão de obra, terceiros e tributos — mesma classificação usada em Obras e contratos.' });
    const porForn = porPessoa(st.real, 'despesa');
    await chartSlide('Despesas por fornecedor', U.monthLabel(ym), porForn.length ? hbar2(porForn.slice(0, 10).map(x => ({ label: x.k, value: x.v, extra: x.n + ' lanç.', cls: 'wfneg' })), chartOpt) : null);
    tableSlide('Despesas por fornecedor · detalhado', U.monthLabel(ym), [
      { l: 'Fornecedor', f: r => r.k },
      { l: 'Lanç.', n: true, f: r => String(r.n) },
      { l: 'Valor', n: true, f: r => U.money(r.v) },
      { l: '%', n: true, f: r => U.pct(st.desp ? r.v / st.desp : 0) },
    ], porForn.slice(0, 14), { colW: [6, 2, 2.3, 1.8] });

    /* ---------- Pessoal ---------- */
    const folhaReal = r => r.folha && r.folha !== 'Não é folha';
    const porPessoaFolha = groupSum(st.real.filter(r => r.k === 'despesa' && folhaReal(r)), r => r.pessoa || '(sem identificação)');
    if (porPessoaFolha.length) {
      divider('Pessoal', U.monthLabel(ym) + ' · ' + subScope);
      const totalPessoal = U.sum(porPessoaFolha, x => x.v);
      const adiant = st.real.filter(r => r.k === 'despesa' && r.folha === 'Adiantamentos');
      kpiSlide('Custo de pessoal no mês', U.monthLabel(ym), [
        { label: 'Total de pessoal', value: U.money(totalPessoal), note: porPessoaFolha.length + ' pessoa(s)', bar: TH.neg },
        { label: 'Custo médio por pessoa', value: U.money(porPessoaFolha.length ? U.r2(totalPessoal / porPessoaFolha.length) : 0), note: 'média simples', bar: TH.brand },
        { label: 'Adiantamentos no mês', value: U.money(U.sum(adiant, r => r.valor)), note: adiant.length + ' lançamento(s)', bar: TH.accent },
        { label: '% das despesas do mês', value: st.desp ? U.pct(totalPessoal / st.desp) : '—', note: 'total de pessoal / despesas', bar: TH.ink3 },
      ]);
      await chartSlide('Comparação entre pessoas', U.monthLabel(ym) + ' · custo total', hbar2(porPessoaFolha.slice(0, 10).map(x => ({ label: x.k, value: x.v, extra: x.n + ' lanç.', cls: 'wfneg' })), chartOpt));
      tableSlide('Pessoas · detalhado', U.monthLabel(ym), [
        { l: 'Pessoa', f: r => r.k },
        { l: 'Lanç.', n: true, f: r => String(r.n) },
        { l: 'Valor', n: true, f: r => U.money(r.v) },
        { l: '%', n: true, f: r => U.pct(totalPessoal ? r.v / totalPessoal : 0) },
      ], porPessoaFolha.slice(0, 14), { colW: [6, 2, 2.3, 1.8] });
      const porClasse = groupSum(st.real.filter(x => x.k === 'despesa' && folhaReal(x)), x => x.folha);
      await chartSlide('Por classe', U.monthLabel(ym) + ' · salário, encargos, benefícios, adiantamentos...', porClasse.length ? hbar2(porClasse.map(x => ({ label: x.k, value: x.v, extra: x.n + ' lanç.', cls: 'wfneg' })), chartOpt) : null);
      const adiantSeries = series6.map(x => ({ ym: x.ym, v: U.sum(x.real.filter(r => r.k === 'despesa' && r.folha === 'Adiantamentos'), r => r.valor) }));
      await chartSlide('Adiantamentos — impacto no caixa', 'Últimos 6 meses · ' + subScope, flowChart([{ name: 'Adiantamentos', cls: 'lndesp', points: adiantSeries.map(x => ({ l: U.monthLabel(x.ym), v: x.v })) }], { h: 260, legend: false }), { caption: adiant.length + ' lançamento(s) de adiantamento neste mês, total ' + U.money(U.sum(adiant, r => r.valor)) + '. Mostra o ritmo (semanal/quinzenal) do impacto no caixa.' });
    }

    /* ---------- Obras (detalhamento é prioridade) ---------- */
    const mObras = obraMonthStats(data().all, S.settings, ym, cnpj);
    if (mObras.length) {
      divider('Obras', U.monthLabel(ym) + ' · ' + subScope);
      const recMes = U.sum(mObras, o => o.rec), despMes = U.sum(mObras, o => o.desp);
      kpiSlide('Obras no mês', U.monthLabel(ym), [
        { label: 'Obras com lançamento', value: String(mObras.length), note: U.monthLabel(ym), bar: TH.brand },
        { label: 'Receita do mês', value: U.money(recMes), note: 'lançado nas obras', bar: TH.pos },
        { label: 'Despesa do mês', value: U.money(despMes), note: 'custo lançado nas obras', bar: TH.neg },
        { label: 'Resultado do mês', value: U.money(U.r2(recMes - despMes)), note: 'receita − despesa', bar: TH.accent },
      ]);
      await twoChartSlide('Comparação entre obras', U.monthLabel(ym),
        { title: 'Receita do mês', html: hbar2(mObras.slice(0, 10).map(o => ({ label: o.centro, value: o.rec, extra: o.n + ' lanç.', cls: 'wfpos' })), { valueWidth: 120, w: 700, labelWidth: 230, rowH: 34 }) },
        { title: 'Resultado do mês', html: hbar2(mObras.slice(0, 10).map(o => ({ label: o.centro, value: o.res, cls: o.res < 0 ? 'wfneg' : 'wfpos' })), { valueWidth: 120, w: 700, labelWidth: 230, rowH: 34 }) });
      tableSlide('Obras · detalhado', U.monthLabel(ym), [
        { l: 'Obra', f: o => o.centro },
        { l: 'Lanç.', n: true, f: o => String(o.n) },
        { l: 'Receita', n: true, f: o => U.money(o.rec) },
        { l: 'Despesa', n: true, f: o => U.money(o.desp) },
        { l: 'Resultado', n: true, f: o => U.money(o.res), color: o => o.res < 0 ? TH.neg : TH.pos },
      ], mObras.slice(0, 14), { colW: [4.6, 1.5, 2.0, 2.0, 2.033] });
      const gAgg = {}; mObras.forEach(o => Object.entries(o.grupos).forEach(([g, v]) => gAgg[g] = U.r2((gAgg[g] || 0) + v)));
      const gRows = Object.entries(gAgg).map(([k, v]) => ({ k, v })).sort((a, b) => b.v - a.v);
      if (gRows.length) await chartSlide('Despesas das obras por grupo de custo', U.monthLabel(ym), hbar2(gRows.map(x => ({ label: x.k, value: x.v, cls: 'wfneg' })), chartOpt));

      /* detalhe individual das obras com maior movimento no mês: o pedido mais importante do cliente */
      const topObras = [...mObras].sort((a, b) => (b.rec + b.desp) - (a.rec + a.desp)).slice(0, 6);
      for (const o of topObras) {
        const porCatO = groupSum(o.l.filter(r => r.k === 'despesa'), r => r.categoria || '(sem categoria)');
        const porFornO = groupSum(o.l.filter(r => r.k === 'despesa'), r => r.pessoa || '(sem identificação)');
        const sl = newSlide(o.centro, 'Detalhamento da obra · ' + U.monthLabel(ym));
        kpiRow(sl, 1.4, [
          { label: 'Receita no mês', value: U.money(o.rec), bar: TH.pos },
          { label: 'Despesa no mês', value: U.money(o.desp), bar: TH.neg },
          { label: 'Resultado', value: U.money(o.res), note: o.rec ? U.pct(o.res / o.rec) + ' margem' : '—', bar: TH.accent },
          { label: 'Lançamentos', value: String(o.n), note: U.monthLabel(ym), bar: TH.brand },
        ]);
        const halfW = (W - 1.2 - 0.4) / 2;
        sl.addText('Despesas por categoria', { x: 0.6, y: 3.05, w: halfW, h: 0.3, fontSize: 13, bold: true, color: TH.ink2, fontFace: SANS });
        sl.addText('Despesas por fornecedor', { x: 0.6 + halfW + 0.4, y: 3.05, w: halfW, h: 0.3, fontSize: 13, bold: true, color: TH.ink2, fontFace: SANS });
        const smallOpt = { valueWidth: 110, w: 700, labelWidth: 230, rowH: 30 };
        const [imgCat, imgForn] = await Promise.all([
          porCatO.length ? chartToPng(hbar2(porCatO.slice(0, 8).map(x => ({ label: x.k, value: x.v, extra: x.n + ' lanç.', cls: 'wfneg' })), smallOpt)) : null,
          porFornO.length ? chartToPng(hbar2(porFornO.slice(0, 8).map(x => ({ label: x.k, value: x.v, extra: x.n + ' lanç.', cls: 'wfneg' })), smallOpt)) : null,
        ]);
        if (imgCat) sl.addImage({ data: imgCat.dataUrl, x: 0.6, y: 3.4, w: halfW, h: Math.min(3.5, halfW * imgCat.h / imgCat.w) });
        else sl.addText('Sem despesas no mês.', { x: 0.6, y: 3.4, fontSize: 12, color: TH.ink3, fontFace: SANS });
        if (imgForn) sl.addImage({ data: imgForn.dataUrl, x: 0.6 + halfW + 0.4, y: 3.4, w: halfW, h: Math.min(3.5, halfW * imgForn.h / imgForn.w) });
        else sl.addText('Sem despesas no mês.', { x: 0.6 + halfW + 0.4, y: 3.4, fontSize: 12, color: TH.ink3, fontFace: SANS });
        footer(sl);
      }
      if (mObras.length > topObras.length) {
        const outras = mObras.filter(o => !topObras.includes(o));
        tableSlide('Outras obras do mês', U.monthLabel(ym) + ' · ' + outras.length + ' obra(s) adicionais', [
          { l: 'Obra', f: o => o.centro },
          { l: 'Lanç.', n: true, f: o => String(o.n) },
          { l: 'Receita', n: true, f: o => U.money(o.rec) },
          { l: 'Despesa', n: true, f: o => U.money(o.desp) },
          { l: 'Resultado', n: true, f: o => U.money(o.res), color: o => o.res < 0 ? TH.neg : TH.pos },
        ], outras, { colW: [4.6, 1.5, 2.0, 2.0, 2.033] });
      }
      const O = obraStats(recs(), S.settings), Lobras = O.obras;
      if (Lobras.length) tableSlide('Rentabilidade acumulada por obra', 'Desde o início de cada contrato (lançado = recebido + a receber)', [
        { l: 'Obra', f: o => o.centro },
        { l: 'Lançado', n: true, f: o => U.money(o.lancado) },
        { l: 'Custo', n: true, f: o => U.money(o.custo) },
        { l: 'Resultado', n: true, f: o => U.money(o.resultado), color: o => o.resultado < 0 ? TH.neg : TH.pos },
        { l: 'Margem', n: true, f: o => o.margem == null ? '—' : U.pct(o.margem) + (o.provisorio.length ? ' (provisória)' : '') },
      ], Lobras.slice(0, 14), { colW: [4.0, 2.0, 2.0, 2.0, 2.133] });
    }

    /* ---------- Comparativo ---------- */
    divider('Comparativo', U.monthLabel(ym) + ' × ' + U.monthLabel(prevYm));
    await chartSlide('Receitas × Despesas', U.monthLabel(ym) + ' × ' + U.monthLabel(prevYm), hbar2([
      { label: 'Receitas ' + U.monthLabel(ym), value: st.rec, cls: 'wfpos' },
      { label: 'Receitas ' + U.monthLabel(prevYm), value: pv.rec, cls: 'wftot' },
      { label: 'Despesas ' + U.monthLabel(ym), value: st.desp, cls: 'wfneg' },
      { label: 'Despesas ' + U.monthLabel(prevYm), value: pv.desp, cls: 'wftot' },
    ], { valueWidth: 150, w: 1040 }));

    /* ---------- Pontos de atenção ---------- */
    const inM = r => { const d = r.effDate || r.dueDate; return d && d.slice(0, 7) === ym; };
    const pendN = data().all.filter(r => (cnpj === 'C' || r.cnpj === cnpj) && inM(r) && r.pend.some(p => !/Sem centro de custo/.test(p))).length;
    const saldosCash = st.saldos.filter(b => b.cash);
    const saldosOk = saldosCash.filter(b => b.banco != null).length;
    tableSlide('Pontos de atenção', U.monthLabel(ym), [
      { l: 'Indicador', f: r => r.k },
      { l: 'Situação', f: r => r.v },
    ], [
      { k: 'Pendências de validação', v: String(pendN) },
      { k: 'Em aberto (vencidos até o fim do mês)', v: st.nAbertosVenc + ' · a receber ' + U.money(st.abertosRec) + ' · a pagar ' + U.money(st.abertosDesp) },
      { k: 'Saldos bancários conferidos', v: saldosOk + ' de ' + saldosCash.length },
    ], { colW: [6, 6.1] });

    /* ---------- Encerramento ---------- */
    s = pptx.addSlide(); s.background = { color: TH.brand };
    if (logoFull) s.addImage({ data: logoFull, x: W / 2 - 1.1, y: H / 2 - 2.0, w: 2.2, h: 2.2 });
    s.addText('Obrigado', { x: 0, y: H / 2 + 0.4, w: W, h: 0.7, fontSize: 30, bold: true, color: 'FFFFFF', fontFace: 'Georgia', align: 'center' });
    s.addText('CM Soluções Financeiras · Gestão de caixa', { x: 0, y: H / 2 + 1.05, w: W, h: 0.4, fontSize: 13, color: 'EAD9CE', fontFace: SANS, align: 'center' });

    const fileName = 'fechamento_premium_' + cnpj + '_' + ym + '.pptx';
    const blob = await pptx.write({ outputType: 'blob' });
    await saveOrShareFile(blob, fileName, 'application/vnd.openxmlformats-officedocument.presentationml.presentation');
  } catch (e) {
    console.error(e); toast('Não foi possível gerar o PPT: ' + (e.message || e), true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = prevLabel; }
  }
}

/* ==========================================================================
   Tela: empreitas (controle do saldo a pagar de cada contrato de mão de obra)
   ========================================================================== */

/* empreitas iniciais informadas pelo Tiago em 23/10/2026 */
function defaultEmpreitas() {
  return [
    { id: 'thiago-imigrantes', nome: 'Thiago (empreita Imigrantes)', obra: 'Imigrantes', contratado: 110000,
      recebedores: 'Thiago Alexandre da Silva; Isaac Santos Leite', desde: '2026-10-01', seedRev: 3,
      nota: 'Tudo que é pago ao Thiago (Pix ou dinheiro) e ao Isaac abate dos 110 mil, assim como os descontos (material, EPI, INSS e FGTS do Isaac etc.). Setembro conforme a lista do Alisson (23/10/2026); a partir de outubro os pagamentos vêm do Conta Azul (Tiago, 23/10/2026).',
      manuais: empThiagoAlisson() },
    { id: 'emilio-paroquia', nome: 'Emilio (empreita Paróquia)', obra: 'Mitra', contratado: 35000,
      recebedores: 'Emilio', desde: '2026-10-24',
      nota: 'Contrato da Paróquia (centro de custo Mitra).',
      manuais: [
        { id: 'm1', data: '2026-10-23', recebedor: 'Emilio', valor: 20000, forma: '', ref: 'Total já pago até 23/10/2026 (inclui o dinheiro do saque)', status: 'Conferido' },
      ] },
  ];
}
/* lista enviada pelo Alisson em 23/10/2026: pagamentos até 20/10 e descontos */
function empThiagoAlisson() {
  const m = (id, data, recebedor, valor, forma, ref, status) => ({ id, data, recebedor, valor, forma, ref, status: status || 'Conferido' });
  return [
    m('p1', '2026-09-09', 'Thiago', 10000, 'Pagamento', 'Pg 01 (lista Alisson)'),
    m('p2', '2026-09-12', 'Thiago', 1000, 'Pagamento', 'Pg 02 (lista Alisson)'),
    m('d1', '', 'Desconto', 850, 'Desconto', 'Vidro frente do predio'),
    m('d2', '2026-09-30', 'Desconto', 174.81, 'Desconto', 'INSS e FGTS Isaac set/26'),
    m('d3', '2026-10-31', 'Desconto', null, 'Desconto', 'INSS e FGTS Isaac out/26', 'Aguardando Alisson'),
    m('d4', '', 'Desconto', null, 'Desconto', 'EPI', 'Aguardando Alisson'),
    m('d5', '2026-09-30', 'Desconto', null, 'Desconto', 'Material set/26', 'Aguardando Alisson'),
    m('d6', '2026-10-31', 'Desconto', 169.90, 'Desconto', 'Material out/26 (escada)'),
  ];
}
/* atualiza a empreita do Thiago salva antes da lista do Alisson (só se ainda estiver com os lançamentos iniciais sem valor) */
function empUpgrade(list) {
  const e = list.find(x => x.id === 'thiago-imigrantes'); if (!e) return false;
  if (!e.seedRev && (e.manuais || []).every(m => m.valor == null)) { e.manuais = empThiagoAlisson(); e.desde = '2026-10-01'; e.seedRev = 3; e.nota = defaultEmpreitas()[0].nota; return true; }
  /* versão de 23/10 que lançava Pg 03 a 05 à mão: a partir de outubro passa a valer o Conta Azul */
  if (e.seedRev === 2) { e.manuais = (e.manuais || []).filter(m => !['p3', 'p4', 'p5'].includes(m.id)); if (e.desde === '2026-10-21') e.desde = '2026-10-01'; e.seedRev = 3; e.nota = defaultEmpreitas()[0].nota; return true; }
  return false;
}
const EMP_STATUS = ['Conferido', 'Aguardando comprovante', 'Aguardando Alisson'];

function empNames(e) { return String(e.recebedores || '').split(/[;,\n]/).map(s => U.key(s)).filter(Boolean); }
/* lançamentos do Conta Azul (todos os CNPJs) pagos a um dos recebedores da empreita */
function empStats(e, all) {
  const names = empNames(e);
  const match = r => { const p = U.key(r.pessoa); return p && names.some(n => p === n || p.startsWith(n + ' ')); };
  const L = all.filter(r => r.k === 'despesa' && match(r));
  const pagos = L.filter(r => (r.st === 'realizado' || r.st === 'parcial') && r.effDate && r.effDate >= (e.desde || '0000'));
  const abertos = L.filter(r => r.open);
  const pagoCA = U.sum(pagos, r => r.st === 'parcial' ? r.paidAmt : r.valor);
  const man = e.manuais || [];
  const pagoMan = U.sum(man, m => m.valor || 0);
  const pago = U.r2(pagoCA + pagoMan);
  const prov = U.sum(abertos, r => r.openAmt);
  const c = e.contratado;
  return { pagos, abertos, pagoCA, pagoMan, pago, prov, saldo: c == null ? null : U.r2(c - pago), saldoAposProv: c == null ? null : U.r2(c - pago - prov), pct: c ? pago / c : null, semValor: man.filter(m => m.valor == null).length };
}

VIEWS.empreitas = function (main) {
  const D = data(); const all = D ? D.all : [];
  const st = S.settings; if (!Array.isArray(st.empreitas)) st.empreitas = defaultEmpreitas();
  if (empUpgrade(st.empreitas)) saveSettings();
  const cols = COLS.pagar();
  let html = head('Empreitas', 'Saldo a pagar de cada contrato de mão de obra · todos os CNPJs');
  html += `<div class="banner small"><b>Como funciona:</b> o <b>pago no Conta Azul</b> soma as despesas quitadas a partir da data indicada para as pessoas listadas como recebedores (nome igual ao do Conta Azul). Pagamentos <b>antes dessa data</b> ou <b>fora do Conta Azul</b> (dinheiro) entram como lançamento manual. Não lance manualmente o que já está no Conta Azul, para não contar duas vezes. O <b>provisionado</b> são parcelas em aberto no Conta Azul para esses recebedores.</div>`;
  for (const e of st.empreitas) {
    const x = empStats(e, all); const id = U.esc(e.id);
    const inp = (k, v, w, t) => `<input data-emp="${id}" data-k="${k}" value="${U.esc(v == null ? '' : v)}" ${t ? `type="${t}"` : ''} style="width:${w}">`;
    html += `<div class="card"><h3>${U.esc(e.nome)}</h3>
      <div class="kpis">${kpi('Contratado', e.contratado == null ? 'informar' : e.contratado, 'valor total da empreita')}${kpi('Pago no Conta Azul', x.pagoCA, 'desde ' + U.br(e.desde), x.pagos, { cols, cls: 'confirmado' })}${kpi('Pago fora / antes + descontos', x.pagoMan, 'lançamentos manuais' + (x.semValor ? ` · ${x.semValor} sem valor` : ''), null, { cls: x.semValor ? 'warn' : '' })}${kpi('Total pago', x.pago, x.pct == null ? '' : U.pct(x.pct) + ' do contrato')}${kpi('Saldo a pagar', x.saldo == null ? '—' : x.saldo, x.semValor ? 'provisório: falta informar valores' : 'contratado − pago', null, { cls: x.saldo != null && x.saldo < 0 ? 'warn' : '' })}${kpi('Provisionado em aberto', x.prov, 'saldo depois: ' + (x.saldoAposProv == null ? '—' : U.money(x.saldoAposProv)), x.abertos, { cols })}</div>
      ${x.pct != null ? `<div class="bar" style="width:100%;height:10px;margin:4px 0 12px"><i style="width:${Math.min(100, Math.max(0, x.pct * 100))}%"></i></div>` : ''}
      <p class="small">${U.esc(e.nota || '')}</p>
      <div class="filters small">Nome ${inp('nome', e.nome, '220px')} Obra ${inp('obra', e.obra, '110px')} Contratado ${inp('contratado', e.contratado == null ? '' : String(e.contratado).replace('.', ','), '100px')} Conta Azul a partir de ${inp('desde', e.desde, '140px', 'date')}<br>Recebedores (separar por ;) ${inp('recebedores', e.recebedores, '420px')}</div>
      <h4>Lançamentos manuais</h4>
      ${stable([
        { l: 'Data', f: m => `<input type="date" data-man="${id}|${U.esc(m.id)}" data-k="data" value="${U.esc(m.data || '')}">` },
        { l: 'Recebedor', f: m => `<input data-man="${id}|${U.esc(m.id)}" data-k="recebedor" value="${U.esc(m.recebedor || '')}" size="12">` },
        { l: 'Valor', n: true, f: m => `<input class="num" inputmode="decimal" data-man="${id}|${U.esc(m.id)}" data-k="valor" value="${m.valor == null ? '' : String(m.valor).replace('.', ',')}" placeholder="informar">` },
        { l: 'Forma', f: m => `<input data-man="${id}|${U.esc(m.id)}" data-k="forma" value="${U.esc(m.forma || '')}" size="8">` },
        { l: 'Referência', f: m => `<input data-man="${id}|${U.esc(m.id)}" data-k="ref" value="${U.esc(m.ref || '')}" size="40">` },
        { l: 'Status', f: m => `<select data-man="${id}|${U.esc(m.id)}" data-k="status">${EMP_STATUS.map(s => `<option ${m.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>` },
        { l: '', f: m => `<button class="btn sm" data-mandel="${id}|${U.esc(m.id)}">Excluir</button>` },
      ], e.manuais || [], { foot: ['Total', '', U.money(x.pagoMan), '', '', '', ''] })}
      <p><button class="btn sm" data-manadd="${id}">+ Lançamento manual</button> <a class="btn sm" data-drill="${drillId('Pagos no Conta Azul: ' + e.nome, x.pagos, cols)}">Ver pagos no Conta Azul (${x.pagos.length})</a> <button class="btn sm" data-empdel="${id}">Excluir empreita</button></p></div>`;
  }
  html += `<p><button class="btn" id="emp-add">+ Nova empreita</button></p>`;
  main.innerHTML = html;
  const find = id => st.empreitas.find(e => e.id === id);
  const save = async () => { await saveSettings(); render(); };
  $$('[data-emp]').forEach(el => el.onchange = async () => { const e = find(el.dataset.emp); const k = el.dataset.k; e[k] = k === 'contratado' ? P.number(el.value) : el.value.trim(); await save(); });
  $$('[data-man]').forEach(el => el.onchange = async () => { const [eid, mid] = el.dataset.man.split('|'); const m = (find(eid).manuais || []).find(y => y.id === mid); const k = el.dataset.k; m[k] = k === 'valor' ? P.number(el.value) : el.value.trim(); m.at = Date.now(); await save(); });
  $$('[data-mandel]').forEach(el => el.onclick = async () => { const [eid, mid] = el.dataset.mandel.split('|'); if (!confirm('Excluir este lançamento manual?')) return; const e = find(eid); e.manuais = e.manuais.filter(y => y.id !== mid); await save(); });
  $$('[data-manadd]').forEach(el => el.onclick = async () => { const e = find(el.dataset.manadd); (e.manuais = e.manuais || []).push({ id: 'm' + Date.now(), data: U.today(), recebedor: '', valor: null, forma: 'Dinheiro', ref: '', status: 'Aguardando comprovante' }); await save(); });
  $$('[data-empdel]').forEach(el => el.onclick = async () => { if (!confirm('Excluir esta empreita e os lançamentos manuais dela?')) return; st.empreitas = st.empreitas.filter(e => e.id !== el.dataset.empdel); await save(); });
  $('#emp-add').onclick = async () => { st.empreitas.push({ id: 'e' + Date.now(), nome: 'Nova empreita', obra: '', contratado: null, recebedores: '', desde: U.today(), nota: '', manuais: [] }); await save(); };
};
