<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Premium · Gestão de Caixa</title>
<link rel="icon" href="../../assets/img/clientes/premium-pinturas.png">
<style>
:root{
  /* identidade visual Premium Pinturas Prediais: vinho, marrom escuro e dourado */
  --bg:#f7f3ef;--panel:#ffffff;--ink:#241614;--ink2:#5b4743;--ink3:#8c7a75;--line:#e8dfd9;--line2:#f3ede8;
  --brand:#3b1716;--brand2:#8c2323;--accent:#d4a03f;--gold:#e8b44c;--accentbg:#f8efe0;
  --side1:#2a1515;--side2:#6e1d1d;
  --pos:#5f8268;--neg:#a8655a;--warn:#a8761b;--warnbg:#fbf1dc;--badbg:#fbe9e7;--okbg:#e8f4ec;--infobg:#f6ece6;
  --c52:#8c2323;--c20:#a8761b;--shadow:0 1px 2px rgba(48,20,16,.06),0 2px 8px rgba(48,20,16,.05);
  --a1:#b8860b;--a2:#9c3f73;--a3:#3366a3;--a4:#b5652e;--a5:#0d9488;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151010;--panel:#211817;--ink:#f1e9e4;--ink2:#c9b8b1;--ink3:#93827c;--line:#3a2b28;--line2:#2a201e;
  --brand:#e8b44c;--brand2:#d9a043;--accent:#e8b44c;--gold:#e8b44c;--accentbg:#3a2a14;--side1:#140b0b;--side2:#3d1414;
  --pos:#7fa98e;--neg:#c98a7d;--warn:#e8b04a;--warnbg:#3a2e14;--badbg:#3d1d1a;--okbg:#14301f;--infobg:#2c201d;
  --c52:#d0605a;--c20:#d9a043;--shadow:none;
  --a1:#b8832c;--a2:#c06a9c;--a3:#5a8fcf;--a4:#cf7a4a;--a5:#1f9a88;}}
:root[data-theme="dark"]{--bg:#151010;--panel:#211817;--ink:#f1e9e4;--ink2:#c9b8b1;--ink3:#93827c;--line:#3a2b28;--line2:#2a201e;--brand:#e8b44c;--brand2:#d9a043;--accent:#e8b44c;--gold:#e8b44c;--accentbg:#3a2a14;--side1:#140b0b;--side2:#3d1414;--pos:#7fa98e;--neg:#c98a7d;--warn:#e8b04a;--warnbg:#3a2e14;--badbg:#3d1d1a;--okbg:#14301f;--infobg:#2c201d;--c52:#d0605a;--c20:#d9a043;--shadow:none;--a1:#b8832c;--a2:#c06a9c;--a3:#5a8fcf;--a4:#cf7a4a;--a5:#1f9a88}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--brand2);cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:22px 0 10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}h3{font-size:15px;margin:0 0 10px}h4{font-size:13px;margin:16px 0 6px;color:var(--ink2)}
.small{font-size:12px;color:var(--ink2)}.muted-t{color:var(--ink3)}.ok-t{color:var(--pos)}.bad-t{color:var(--neg)}.warn-t{color:var(--warn)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
code{background:var(--line2);padding:1px 4px;border-radius:4px}
/* layout */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh;transition:grid-template-columns .15s}
.shell>div{min-width:0}
body.navcollapsed .shell{grid-template-columns:60px 1fr}
aside{background:linear-gradient(160deg,var(--side1),var(--side2));color:#fff;position:sticky;top:0;height:100vh;overflow:auto;padding:14px 10px}
body.navcollapsed aside{padding:14px 6px;overflow:visible}
#navtoggle{position:absolute;top:10px;right:8px;background:rgba(255,255,255,.12);border:0;color:#fff;width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:13px;line-height:1;padding:0}
#navtoggle:hover{background:rgba(255,255,255,.25)}
body.navcollapsed #navtoggle{position:static;display:block;margin:0 auto 8px}
body.navcollapsed .logo-row img{width:34px;height:34px}
body.navcollapsed .logo-row span{display:none}
body.navcollapsed #nav a{justify-content:center;padding:9px 0}
body.navcollapsed #nav a span,body.navcollapsed #nav b,body.navcollapsed .cm-by{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) aside{border-right:1px solid var(--line)}}
.logo-row{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:6px 8px 18px;border-bottom:1px solid rgba(232,180,76,.25);margin-bottom:10px}.logo-row img{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 2px rgba(232,180,76,.55)}
.logo-row b{display:block;font-size:14px;letter-spacing:.02em}.logo-row span{font-size:11px;color:#e8b44c}
#nav a{display:flex;align-items:center;gap:10px;color:#dce9f1;padding:7px 10px;border-radius:7px;font-size:13.5px}
#nav a:hover{background:rgba(255,255,255,.08);text-decoration:none}#nav a.on{background:rgba(232,180,76,.18);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #e8b44c}
#nav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
body.nao-admin a[href="#importacao"],body.nao-admin a[href="#config"],body.nao-admin a[href="#backup"],body.nao-admin a[href="#lancamentos"],body.nao-admin a[href="#empreitas"]{display:none}
#nav b{margin-left:auto;background:#e8b44c;color:#3b1716!important;color:#fff;border-radius:9px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}#nav b:empty{display:none}
.navsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.55);padding:14px 10px 4px;font-weight:600}
.navsec:first-child{padding-top:2px}
body.navcollapsed .navsec{display:none}
.cm-by{font-size:10.5px;color:rgba(255,255,255,.55);text-align:center;margin:22px 0 4px;line-height:1.4}.cm-by b{color:rgba(255,255,255,.75);font-weight:600}
.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:2px solid var(--accent);padding:10px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top .grow{flex:1}#ver-info{font-size:12px;color:var(--ink2)}
#menu{display:none}
main{padding:18px 22px 60px;max-width:1500px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;color:var(--ink2);cursor:pointer;font:inherit;font-size:13px}.seg button.on{background:var(--brand2);color:#fff}
#cnpj-switch button.on[data-c="52"]{background:var(--c52)}#cnpj-switch button.on[data-c="20"]{background:var(--c20)}
.btn{display:inline-block;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--brand2);text-decoration:none}.btn.primary{background:var(--brand2);border-color:var(--brand2);color:#fff}.btn.sm{padding:3px 8px;font-size:12px}.btn.on{background:var(--brand2);color:#fff}.btn[disabled]{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
textarea{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}.vhead .sub{margin:4px 0 0;color:var(--ink2);font-size:13px}.vright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;justify-content:space-between;align-items:baseline}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ink3);border-radius:9px;padding:10px 12px;box-shadow:var(--shadow)}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--brand2)}.kpi.sel{outline:2px solid var(--brand2)}
.kpi.receita{border-left-color:var(--pos)}
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 14px;box-shadow:var(--shadow)}
.hero-main{min-width:170px}
.hero-main .hl{font-size:12px;color:var(--ink2);font-weight:600}
.hero-main .hv{font-family:var(--serif);font-size:38px;font-weight:700;line-height:1;margin:4px 0;white-space:nowrap}
.hero-main .hv.pos{color:var(--pos)}.hero-main .hv.neg{color:var(--neg)}
.hero-main .hs{font-size:12px;color:var(--ink2)}
.hero-grid{display:flex;gap:22px;flex-wrap:wrap;border-left:1px solid var(--line);padding-left:26px}
.hero-grid .hi{min-width:100px}
.hero-grid .hi .hl{font-size:11px;color:var(--ink2);font-weight:600}
.hero-grid .hi .hv{font-size:18px;font-weight:700;margin:2px 0 0;white-space:nowrap}
.pbar{height:8px;border-radius:4px;background:var(--line2);overflow:hidden;margin-top:5px}
.pbar i{display:block;height:100%;border-radius:4px}
.pbar i.rec{background:var(--pos)}.pbar i.desp{background:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tabbtn{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 16px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.tabbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.kpi.bad,.kpi.pendente{border-left-color:var(--neg)}.kpi.warn,.kpi.estimado{border-left-color:var(--warn)}.kpi.ok,.kpi.confirmado{border-left-color:var(--pos)}
.kl{font-size:12px;color:var(--ink2);font-weight:600}.kv{font-size:20px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}.kp{font-size:11.5px;color:var(--ink3)}.kn{margin-top:4px}
.banner{background:var(--infobg);border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:13px}.banner.warn{background:var(--warnbg)}.banner.bad{background:var(--badbg)}.banner.ok{background:var(--okbg)}.banner .btns{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.formula{font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:0 6px;background:var(--line2);color:var(--ink2)}
.tag.c52{background:var(--c52);color:#fff}.tag.c20{background:var(--c20);color:#fff}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--neg)}.tag.ok{background:var(--okbg);color:var(--pos)}
.st{font-size:11.5px;font-weight:600;border-radius:10px;padding:1px 8px;white-space:nowrap}
.st.ok{background:var(--okbg);color:var(--pos)}.st.open{background:var(--infobg);color:var(--ink2)}.st.bad{background:var(--badbg);color:var(--neg)}.st.part,.st.warn{background:var(--warnbg);color:var(--warn)}.st.muted{background:var(--line2);color:var(--ink3)}
label.col{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2);margin-top:8px}label.col textarea{font-family:inherit;font-size:13px}
.form-row.tight{gap:6px;margin-top:6px}.form-row.tight input,.form-row.tight select{padding:3px 6px;font-size:12px;max-width:120px}
input.num{text-align:right;width:100px}.legend-conf{margin:-6px 0 12px}
.conf.calculado{background:var(--infobg);color:var(--ink2)}.kpi.calculado{border-left-color:var(--accent)}
.rv{width:16px;height:16px}.rvdone td{opacity:.6}
.chk{list-style:none;margin:0;padding:0}.chk li{display:grid;grid-template-columns:28px 1fr 170px 130px 1fr 110px;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line2);font-size:12.5px}.chk li .hint{font-size:11.5px;color:var(--ink3)}.chk li .n{font-weight:700;color:var(--ink3)}
.chk li.feito .n{color:var(--pos)}.chk li.pend .n{color:var(--warn)}
@media (max-width:900px){.chk li{grid-template-columns:24px 1fr}}
.conf{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;white-space:nowrap}.conf.confirmado{background:var(--okbg);color:var(--pos)}.conf.estimado{background:var(--warnbg);color:var(--warn)}.conf.pendente{background:var(--badbg);color:var(--neg)}
/* tabelas */
.twrap{overflow:auto;max-width:100%;
  background: linear-gradient(to right, var(--panel) 30%, rgba(0,0,0,0)), linear-gradient(to right, rgba(0,0,0,0), var(--panel) 70%) 100% 0, radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), rgba(0,0,0,0)), radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), rgba(0,0,0,0)) 100% 0;
  background-repeat: no-repeat; background-color: var(--panel);
  background-size: 28px 100%, 28px 100%, 10px 100%, 10px 100%;
  background-position: 0 0, 100% 0, 0 0, 100% 0;
  background-attachment: local, local, scroll, scroll;
}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
.t td.small,.t th.small{font-size:inherit}
.t th{position:sticky;top:0;background:var(--line2);text-align:left;font-weight:600;color:var(--ink2);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.t th.asc:after{content:" ▲";font-size:9px}.t th.desc:after{content:" ▼";font-size:9px}
.t td{padding:5px 8px;border-bottom:1px solid var(--line2);vertical-align:top;white-space:nowrap}
.t td.wrap{white-space:normal;min-width:180px;max-width:340px}.t .n{text-align:right;font-variant-numeric:tabular-nums}
.t tbody tr[data-rec]:hover,.t.click tbody tr:hover{background:var(--accentbg);cursor:pointer}
.t tfoot td{font-weight:700;border-top:2px solid var(--line)}.t .none{text-align:center;color:var(--ink3);padding:16px}
.t tr.rowbad td{background:var(--badbg)}
.t tr.sel td{background:var(--accentbg)}
.ctwrap .ct-full{display:none}
.ctwrap.open .ct-short{display:none}
.ctwrap.open .ct-full{display:block}
.ctwrap .ct-toggle{margin-top:8px}
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.tbar input{min-width:220px}.tinfo{font-size:12px;color:var(--ink2);flex:1}
.pager{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.bar{width:90px;height:7px;background:var(--line2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink3)}.bar i.pos{background:var(--pos)}.bar i.neg{background:var(--neg)}
.kvt{border-collapse:collapse;width:100%;font-size:12.5px}.kvt th{text-align:left;color:var(--ink2);font-weight:500;padding:4px 10px 4px 0;width:240px;vertical-align:top}.kvt td{padding:4px 0;border-bottom:1px solid var(--line2)}.kvt.raw{font-size:12px}
/* gráfico */
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line2)}.chart .zero{stroke:var(--ink3);stroke-width:1}.chart .risk{stroke:var(--neg);stroke-dasharray:4 4}
.chart .line,.chart .grid,.chart .zero,.chart .risk,.chart .wfconn{vector-effect:non-scaling-stroke}
.chart .ax{font-size:var(--fs,11px);fill:var(--ink3)}.chart .line{fill:none;stroke-width:2.2}.chart .s0{stroke:var(--brand2);fill:var(--brand2)}.chart .s1{stroke:var(--accent);fill:var(--accent)}.chart .s2{stroke:var(--ink3);fill:var(--ink3)}
.chart path.line{fill:none}.chart .bin{fill:var(--pos);opacity:.45}.chart .bout{fill:var(--neg);opacity:.45}.chart .negpt{fill:var(--neg)}
.chart .a1{fill:var(--a1)}.chart .a2{fill:var(--a2)}.chart .a3{fill:var(--a3)}.chart .a4{fill:var(--a4)}.chart .a5{fill:var(--a5)}.chart .aOther{fill:var(--ink3)}
.chart .wfpos{fill:var(--pos)}.chart .wfneg{fill:var(--neg)}.chart .wftot{fill:var(--brand2)}.chart .wfconn{stroke:var(--ink3);stroke-dasharray:3 3}
.chart .val{font-size:var(--fs,11px);font-weight:700;fill:var(--ink)}.chart .lbl{font-size:var(--fs,11px);fill:var(--ink2)}
.chart .lnrec{stroke:var(--pos);fill:var(--pos)}.chart .lndesp{stroke:var(--neg);fill:var(--neg)}.chart .lnres{stroke:var(--ink3);fill:var(--ink3)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend button.lgbtn{display:inline-flex;align-items:center;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer}.legend button.lgbtn.off{opacity:.35}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--panel);padding:7px 10px;border-radius:7px;font-size:12px;line-height:1.4;z-index:9999;max-width:280px;box-shadow:var(--shadow);display:none}
#tip b{font-weight:700}
.lg.s0{background:var(--brand2)}.lg.s1{background:var(--accent)}.lg.s2{background:var(--ink3)}.lg.bin{background:var(--pos);opacity:.5}.lg.bout{background:var(--neg);opacity:.5}
.lg.a1{background:var(--a1)}.lg.a2{background:var(--a2)}.lg.a3{background:var(--a3)}.lg.a4{background:var(--a4)}.lg.a5{background:var(--a5)}.lg.aOther{background:var(--ink3)}
.lg.lnrec{background:var(--pos)}.lg.lndesp{background:var(--neg)}.lg.lnres{background:var(--ink3)}
/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cdh{font-size:11px;color:var(--ink3);text-align:center;text-transform:uppercase}
.cd{min-height:92px;border:1px solid var(--line2);border-radius:7px;padding:5px;font-size:12px;background:var(--panel);display:flex;flex-direction:column}.cd.off{background:transparent;border:0}
.cd.click{cursor:pointer}.cd.click:hover{border-color:var(--brand2)}.cd.today{outline:2px solid var(--brand2)}.cd.risk{background:var(--badbg)}
.cdn{font-weight:700;color:var(--ink2)}.cdb{font-size:10.5px;color:var(--ink3);margin-top:auto;padding-top:3px}
/* alertas */
ul.alerts{list-style:none;margin:0;padding:0}ul.alerts li{display:grid;grid-template-columns:260px 1fr auto;gap:10px;padding:8px 10px;border-left:4px solid var(--ink3);background:var(--line2);border-radius:6px;margin-bottom:6px;cursor:pointer;align-items:baseline}
ul.alerts li.bad{border-left-color:var(--neg);background:var(--badbg)}ul.alerts li.warn{border-left-color:var(--warn);background:var(--warnbg)}ul.alerts li span{font-size:13px}ul.alerts li em{font-size:12px;color:var(--ink3);font-style:normal}
/* formulários */
.form-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}.form-row label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}.form-row .grow{flex:1;min-width:200px}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 14px}.mapgrid label{display:flex;flex-direction:column;font-size:12px;color:var(--ink2);gap:3px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.filters label{font-size:12px;color:var(--ink2)}
.sc label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;margin:6px 0}.sc input{width:120px}.scr{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;font-size:13px;display:grid;gap:3px}
.drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;cursor:pointer;color:var(--ink2);background:var(--line2)}.drop.over{border-color:var(--brand2);background:var(--accentbg)}.drop input{display:none}.drop.sm{padding:14px}
.empty{max-width:640px;margin:60px auto;text-align:center}.empty p{color:var(--ink2)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(10,20,30,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}#modal.on{display:flex}
.mbox{background:var(--panel);border-radius:12px;max-width:760px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}.mbox.wide{max-width:1300px}

<script>/* ==========================================================================
   Premium Caixa: núcleo (utilitários, leitura, normalização e cálculos)
   Tudo roda no navegador. Nenhum dado sai do computador.
   ========================================================================== */
'use strict';

const APP_VERSION = '2.0.0';
const SCHEMA = 2;

/* ---------- utilitários ---------- */
const U = {
  strip(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, ''); },
  key(s) { return U.strip(s).toLowerCase().replace(/\(r\$\)/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); },
  esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  r2(n) { return Math.round((+n || 0) * 100) / 100; },
  money(n, opt) {
    if (n == null || isNaN(n)) return '—';
    const s = (Math.abs(n) < 0.005 ? 0 : n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    return opt && opt.sign && n > 0 ? '+' + s : s;
  },
  num(n, d = 0) { return (n == null || isNaN(n)) ? '—' : n.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }); },
  pct(n) { return (n == null || !isFinite(n)) ? '—' : (n * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%'; },
  /* datas ISO yyyy-mm-dd (sem fuso) */
  iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); },
  today() { return U.iso(new Date()); },
  d(isoStr) { const [y, m, dd] = isoStr.split('-').map(Number); return new Date(y, m - 1, dd); },
  addDays(isoStr, n) { const d = U.d(isoStr); d.setDate(d.getDate() + n); return U.iso(d); },
  diff(a, b) { return Math.round((U.d(a) - U.d(b)) / 86400000); }, // a - b em dias
  br(isoStr) { if (!isoStr) return '—'; const [y, m, d] = isoStr.split('-'); return d + '/' + m + '/' + y; },
  brShort(isoStr) { if (!isoStr) return '—'; const [, m, d] = isoStr.split('-'); return d + '/' + m; },
  month(isoStr) { return isoStr ? isoStr.slice(0, 7) : null; },
  monthLabel(ym) { if (!ym) return '—'; const n = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez']; const [y, m] = ym.split('-'); return n[+m - 1] + '/' + y.slice(2); },
  endOfMonth(isoStr) { const d = U.d(isoStr); return U.iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)); },
  weekStart(isoStr) { const d = U.d(isoStr); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return U.iso(d); }, // segunda
  dt(ts) { const d = new Date(ts); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); },
  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
  hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); },
  groupBy(arr, fn) { const m = new Map(); for (const x of arr) { const k = fn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; },
  sum(arr, fn) { let s = 0; for (const x of arr) s += (fn ? fn(x) : x) || 0; return U.r2(s); },
  median(a) { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; },
};

/* ---------- conversão de valores e datas brasileiras ---------- */
const P = {
  number(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    let s = String(v).trim();
    if (!s || s === '-' || s === '—') return null;
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    s = s.replace(/R\$|\s| /g, '');
    if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); }
    if (s.startsWith('-')) { neg = !neg; s = s.slice(1); }
    if (s.startsWith('+')) s = s.slice(1);
    if (/^\d{1,3}(\.\d{3})*(,\d+)?$/.test(s) || /^\d+(,\d+)$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(,\d{3})*(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
    else if (/^\d+$/.test(s) || /^\d+\.\d+$/.test(s)) { /* já ok */ }
    else return null;
    const n = parseFloat(s);
    return isNaN(n) ? null : (neg ? -n : n);
  },
  date(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date) { if (isNaN(v)) return null; return U.iso(new Date(v.getFullYear(), v.getMonth(), v.getDate())); }
    if (typeof v === 'number') { // serial do Excel
      if (v < 20000 || v > 80000) return null;
      const d = new Date(Math.round((v - 25569) * 86400000)); return U.iso(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    }
    const s = String(v).trim();
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if (m) { let y = +m[3]; if (y < 100) y += 2000; const d = new Date(y, +m[2] - 1, +m[1]); return (d.getMonth() === +m[2] - 1) ? U.iso(d) : null; }
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + '-' + m[2] + '-' + m[3];
    return null;
  },
  text(v) { if (v == null) return ''; if (v instanceof Date) return U.br(P.date(v)); return String(v).replace(/\s+/g, ' ').trim(); },
};

/* ---------- campos reconhecidos e sinônimos de coluna ---------- */
const FIELDS = [

  { id: 'dtComp', label: 'Data de competência', syn: ['data de competencia', 'competencia', 'data competencia'] },

/* Localiza a linha de cabeçalho e sugere o mapeamento */
function detectHeader(rows) {
  let best = { idx: -1, score: 0 };
  const lim = Math.min(rows.length, 40);
  for (let i = 0; i < lim; i++) {
    const r = rows[i] || [];
    let score = 0;
    for (const c of r) { const k = U.key(c); if (!k) continue; if (FIELDS.some(f => f.syn.includes(k))) score++; }
    if (score > best.score) best = { idx: i, score };
  }
  return best.score >= 3 ? best.idx : -1;
}
function suggestMapping(headers) {
  const map = {}; const used = new Set();
  // 1º passe: correspondência exata; 2º: contém
  for (const pass of [0, 1]) {
    for (const f of FIELDS) {
      if (map[f.id] != null) continue;
      for (let j = 0; j < headers.length; j++) {
        if (used.has(j)) continue;
        const k = U.key(headers[j]); if (!k) continue;
        const ok = pass === 0 ? f.syn.includes(k) : f.syn.some(s => s.length > 4 && (k.startsWith(s + ' ') || k === s));
        if (ok) { map[f.id] = j; used.add(j); break; }
      }
    }
  }
  return map;
}

/* ---------- leitura de arquivos (XLS, XLSX, CSV) ---------- */
async function readFileRows(file) {
  const buf = await file.arrayBuffer();
  const name = file.name || 'arquivo';
  let wb;
  const isCsv = /\.(csv|txt)$/i.test(name);
  if (isCsv) {
    let txt = new TextDecoder('utf-8').decode(buf);
    if (txt.includes('�')) txt = new TextDecoder('windows-1252').decode(buf);
    const first = txt.split(/\r?\n/)[0] || '';
    const FS = (first.split(';').length > first.split(',').length) ? ';' : (first.includes('\t') ? '\t' : ',');
    wb = XLSX.read(txt, { type: 'string', FS, raw: true, cellDates: false });
  } else {
    wb = XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: true, raw: false, dense: false });
  }
  const sheets = wb.SheetNames.map(sn => {
    const ws = wb.Sheets[sn];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
    return { name: sn, rows };
  });
  // escolhe a aba com cabeçalho reconhecível
  let pick = null;
  for (const s of sheets) { const h = detectHeader(s.rows); if (h >= 0) { pick = { ...s, headerIdx: h }; break; } }
  if (!pick) pick = { ...sheets[0], headerIdx: -1 };
  return { fileName: name, size: file.size, sheetName: pick.name, sheets: sheets.map(s => s.name), rows: pick.rows, headerIdx: pick.headerIdx };
}

/* ---------- normalização dos valores de Situação e Tipo ---------- */
function guessStatus(v) {
  const k = U.key(v);
  if (!k) return 'indefinido';
  if (/cancel|perdid|estornad|excluid/.test(k)) return 'cancelado';
  if (/parcial/.test(k)) return 'parcial';
  if (/quitad|pago|paga|recebid|conciliad|liquidad|baixad|realizad|efetivad|transferid/.test(k)) return 'realizado';
  if (/atras|vencid|aberto|abert|a vencer|pendente|agendad|previst|em dia|nao pago|a pagar|a receber/.test(k)) return 'aberto';
  return 'indefinido';
}
function guessTipo(v) {
  const k = U.key(v);
  if (!k) return 'indefinido';
  if (/saldo inicial|saldo anterior/.test(k)) return 'saldo';
  if (/transf/.test(k)) return 'transferencia';
  if (/receita|entrada|recebimento|credito|a receber/.test(k)) return 'receita';
  if (/despesa|saida|pagamento|debito|a pagar/.test(k)) return 'despesa';
  return 'indefinido';
}
/* tipo do lançamento: a origem identifica transferências e saldos iniciais (o campo Tipo só traz Receita/Despesa) */
function classifyKind(r, settings) {
  const o = U.key(r.origem), c = U.key(r.categoria);
  if (/transfer/.test(o) || /^transferencia de (entrada|saida)/.test(c)) return 'transferencia';
  if (/saldo conta|saldo inicial/.test(o) || c === 'saldo inicial') return 'saldo';
  return settings.tipoMap[r.tipo] || guessTipo(r.tipo);
}
function guessCnpj(conta) {
  const k = U.key(conta);
  const has52 = /\b52\b/.test(k), has20 = /\b20\b/.test(k);
  if (has52 && !has20) return '52';
  if (has20 && !has52) return '20';
  return '';
}
function guessAcctType(conta) {
  const k = U.key(conta);
  if (/cartao|credito|card/.test(k)) return 'cartao';
  if (/caixa/.test(k)) return 'caixa';
  if (/aplica|investiment|capital|poupanca/.test(k)) return 'aplicacao';
  return 'banco';
}
/* conta entra no disponível (caixa)? Padrão: conta corrente e dinheiro. Cartão e aplicação/capital ficam fora, salvo escolha do usuário. */
function acctDisp(a, type) { return a && a.cash != null ? !!a.cash : (type === 'banco' || type === 'caixa'); }
/* cenário sem premissas: nenhum percentual é sugerido pelo sistema (precisa de histórico ou confirmação da CM) */
function emptyScenario() { return { atrasoRec: 0, perdaRec: 0, aumentoCustos: 0, adiarPag: 0, antecipaRec: 0, extras: [], shifts: [], premissa: '' }; }

    mappingValidated: false,

    overduePolicy: { pagar: 'hoje', receber: 'hoje' },
    riskMin: 0,            // saldo mínimo de segurança
    scenarios: { conservador: emptyScenario(), base: emptyScenario(), otimista: emptyScenario() },
    // a primeira regra que casar define a classe; a ordem importa
    payrollRules: [
      { cls: 'Pró-labore', re: 'pro labore|pro-labore|prolabore' },
      { cls: 'Pensão alimentícia', re: 'pensao' },
      { cls: 'Encargos', re: 'fgts|inss sobre|gps|irrf s/ salario|darf 0561|contribuicao sindical' },
      { cls: 'Férias / 13º / Rescisão', re: 'ferias|13|rescis' },
      { cls: 'Benefícios', re: 'vale transporte|vale-transporte|vale alimentacao|plano de saude colab|seguro de vida|uniforme|exame' },
      { cls: 'Estagiários', re: 'estagi' },
      { cls: 'Autônomos / empreita', re: 'autonomo|empreita|remuneracao de autonomos' },
      { cls: 'Adiantamentos', re: 'adiantamento|vale salarial|vale ' },
      { cls: 'Saldo salarial', re: 'saldo 2 de 2|salario saldo|saldo salario' },
      { cls: 'Salários', re: 'salario|salarios' },
    ],
    manual: {},            // chave do lançamento -> { cnpj?, folha?, nota? }
    // obra (centro de custo) -> CNPJ, usado só para lançamentos SEM conta bancária.
    // Pré-preenchido pelos relatórios de recebimentos por CNPJ enviados pelo Tiago em 01/10/2026; validar.
    centroCnpj: {
      'Carrera': { cnpj: '52', src: 'Relatório de recebimentos CNPJ 52 (01/10/2026)' }, 'Dolce Vitta': { cnpj: '52', src: 'Relatório de recebimentos CNPJ 52 (01/10/2026)' },
      'Porto dos Ilheus': { cnpj: '52', src: 'Relatório de recebimentos CNPJ 52 (01/10/2026)' }, 'Selma': { cnpj: '52', src: 'Relatório de recebimentos CNPJ 52 (01/10/2026)' },
      'Solar da Pedra': { cnpj: '52', src: 'Relatório de recebimentos CNPJ 52 (01/10/2026)' },
      'Ilha Bela': { cnpj: '20', src: 'Relatório de recebimentos CNPJ 20 (01/10/2026)' }, 'Imigrantes': { cnpj: '20', src: 'Relatório de recebimentos CNPJ 20 (01/10/2026)' },
      'Miramar': { cnpj: '20', src: 'Relatório de recebimentos CNPJ 20 (01/10/2026)' }, 'Mitra': { cnpj: '20', src: 'Relatório de recebimentos CNPJ 20 (01/10/2026)' },
      'Continental': { cnpj: '20', src: 'NFs do CNPJ 20 (set/2026)' },
    },
    lastMapping: null,     // último mapeamento de colunas usado
    empreitas: defaultEmpreitas(), // contratos de mão de obra: contratado, recebedores, pagamentos manuais (tela Empreitas)

  for (const n of ['conservador', 'base', 'otimista']) {

    if (fromSchema < 2) {

      if (o && Object.keys(o).every(k => +s[k] === o[k])) { for (const k of Object.keys(o)) s[k] = 0; notes.push('Cenário ' + n + ': percentuais padrão da versão anterior zerados (não tinham base em histórico).'); }

/* ---------- construção de registros normalizados ---------- */

      const row = pf.rows[i] || [];

      if (/^(total|totais|saldo final|subtotal)/.test(firstCell) && !sit) { ignored.push({ file: pf.fileName, line: i + 1, motivo: 'Linha de total', raw }); continue; }

        file: pf.fileName, line: i + 1,

        dtVenc: P.date(g('dtVenc')), dtPrev: P.date(g('dtPrev')), dtPag: P.date(g('dtPag')), dtComp: P.date(g('dtComp')), dtLanc: P.date(g('dtLanc')),
        valorRaw: valor, valor: valor == null ? null : Math.abs(valor),

        desconto: Math.abs(P.number(g('desconto')) || 0), taxas: Math.abs(P.number(g('taxas')) || 0),
        conta: P.text(g('conta')), saldoConta: P.number(g('saldoConta')),

        pessoa: P.text(g('pessoa')), descricao: P.text(g('descricao')), doc: P.text(g('doc')),
        parcela: P.text(g('parcela')), forma: P.text(g('forma')), empresa: P.text(g('empresa')),

/* impressão digital para casar lançamentos sem identificador */

/* ---------- contas renomeadas no Conta Azul ----------

function acctNameKey(n) {

}
// sugestão: conta sem lançamentos na versão atual cujo nome, sem "Conta Corrente", é igual ao de uma conta com lançamentos
function renameSuggestions(settings, contasComLanc) {
  const al = settings.accountAlias || {}; const tem = new Set(contasComLanc); const out = [];
  for (const old of Object.keys(settings.accounts)) {

    if (novo) out.push({ old, novo });

// liga o nome antigo ao novo levando CNPJ, tipo, validação, conciliado até e saldo do banco
function applyAccountAlias(settings, old, novo) {

  settings.accountAlias = settings.accountAlias || {};

  for (const [k, v] of Object.entries(settings.accountAlias)) if (v === old) settings.accountAlias[k] = novo;
  const a = settings.accounts[old], b = settings.accounts[novo] = settings.accounts[novo] || { cnpj: guessCnpj(novo), type: guessAcctType(novo), validated: false };

/* ---------- enriquecimento: aplica configuração e data-base ---------- */
function enrich(records, settings, base) {
  const acc = settings.accounts; const cmap = settings.centroCnpj || {};

    r.st = settings.statusMap[r.situacao] || guessStatus(r.situacao);

    const a = acc[r.conta] || { cnpj: guessCnpj(r.conta), type: guessAcctType(r.conta) };
    const man = settings.manual[r.key] || {};
    const cm = !r.conta && r.centroCusto && cmap[r.centroCusto] && cmap[r.centroCusto].cnpj ? cmap[r.centroCusto] : null;
    r.cnpj = man.cnpj || (r.conta ? a.cnpj : (cm ? cm.cnpj : '')) || '';

    r.effDateSrc = realized ? (r.dtPag ? 'data do movimento' : 'data prevista') : '';

/* ---------- saldos por conta ----------
   O relatório do Conta Azul não traz saldo por conta: a coluna "Saldo conta" é um saldo
   acumulado de todas as contas, incluindo cartões e lançamentos futuros. O saldo de cada conta
   é calculado somando os movimentos realizados (com a linha de saldo inicial) até a data-base.
   (1) saldo inicial importado  (2) movimentos realizados até a data-base  (3) calculado = 1 + 2
   (4) saldo do banco conferido pela CM numa data  (5) diferença = 4 − calculado na mesma data
   (6) projetado = disponível + entradas − saídas em aberto (ver project) */

  const accs = U.groupBy(recs.filter(r => r.conta), r => r.conta);
  const out = [];
  for (const [conta, list] of accs) {
    const a = settings.accounts[conta] || {};
    const type = a.type || guessAcctType(conta);
    const real = list.filter(r => r.st === 'realizado' && r.effDate && r.effDate <= base).sort((x, y) => x.effDate < y.effDate ? -1 : x.effDate > y.effDate ? 1 : x.line - y.line);
    const after = list.filter(r => r.st === 'realizado' && r.effDate && r.effDate > base);
    const ini = list.filter(r => r.k === 'saldo');
    const calc = U.sum(real, r => r.sign * (r.valor || 0));
    const ob = settings.openingBalances[conta];

      calcFromOpening = U.r2(+ob.valor + U.sum(real.filter(r => r.effDate > ob.data), r => r.sign * (r.valor || 0)));
    }

      conta, cnpj: a.cnpj != null ? a.cnpj : guessCnpj(conta), type, cash: acctDisp(a, type), validated: !!a.validated,

      movReal: U.sum(real.filter(r => r.k !== 'saldo'), r => r.sign * (r.valor || 0)),

/* Confere a coluna "Saldo conta" do relatório: refaz o acumulado na ordem do arquivo.

/* saldo inicial da projeção: soma das contas DISPONÍVEIS do CNPJ (conta corrente e dinheiro).

  const accs = scope.filter(b => b.cash);
  let total = 0; const parts = []; let status = 'confirmado'; const issues = [];
  let calcTotal = 0, bankTotal = 0, nBank = 0;
  for (const b of accs) {
    let v, src, ref, conf;
    calcTotal += b.calc || 0;
    if (b.opening && b.opening.valor != null && b.opening.data) {
      v = b.calcFromOpening; src = 'Saldo do banco conferido em ' + U.br(b.opening.data) + ' + movimentos conciliados depois'; ref = b.lastMov && b.lastMov > b.opening.data ? b.lastMov : b.opening.data; conf = 'confirmado';

    else if (!b.validated) { if (status === 'confirmado') status = 'calculado'; if (conf === 'confirmado') conf = 'calculado'; }
    if (b.saldoInicial == null && !b.opening) { issues.push(b.conta + ': relatório sem linha de saldo inicial'); status = 'pendente'; }
    if (b.type === 'banco' && b.stale) issues.push(b.conta + ': ' + (b.conciliadoAte ? 'conciliada até ' + U.br(b.conciliadoAte) + ' (' + b.concDias + ' dias antes da data-base)' : 'data de conciliação não informada' + (b.lastMov ? '; último movimento realizado ' + U.br(b.lastMov) : '')));

/* ---------- projeção do fluxo de caixa ----------
   Entram: lançamentos em aberto e quitados com data posterior à data-base, de contas disponíveis,
   de cartão (na data prevista = vencimento da fatura) e sem conta (pendente).
   Não entram (lista "excluded", com o motivo):
   - lado do cartão das transferências (pagamento de fatura): as compras do cartão já são a saída;
   - lado da conta corrente de um pagamento de fatura agendado, até o valor das compras em aberto

    if (r.badDates && r.badDates.length) issues.push({ tipo: 'Data inválida', n: 1, recs: [r], txt: 'Campo(s) de data ilegível(is): ' + r.badDates.join(', ') });
    if (r.st === 'indefinido') issues.push({ tipo: 'Situação não reconhecida', n: 1, recs: [r], txt: 'Situação "' + r.situacao + '" não reconhecida' });
    if (!r.conta && r.k !== 'saldo') issues.push({ tipo: 'Sem conta bancária', n: 1, recs: [r], txt: (r.pessoa || r.descricao) + ' ' + U.money(r.valor) + ': sem conta, CNPJ ' + (r.cnpj ? 'sugerido pela obra' : 'não identificado') });
    if (r.open && r.valorRaw === 0) issues.push({ tipo: 'Valor zerado em aberto', n: 1, recs: [r], txt: 'Em aberto com valor zero' });
    if (r.valorOriginal != null && r.valor != null && r.st === 'realizado') {
      const exp = U.r2(r.valorOriginal + r.juros + r.multa + r.taxas - r.desconto);
      if ((r.juros || r.multa || r.taxas || r.desconto) && Math.abs(exp - r.valor) > 0.01 && Math.abs(r.valorOriginal - r.valor) > 0.01) issues.push({ tipo: 'Encargos não fecham', n: 1, recs: [r], txt: 'Original + encargos = ' + U.money(exp) + ', valor = ' + U.money(r.valor) });
    }
    if (r.open && r.dtVenc && r.dtPrev && U.diff(r.dtPrev, r.dtVenc) > 60) issues.push({ tipo: 'Data prevista distante do vencimento', n: 1, recs: [r], txt: 'Prevista ' + U.br(r.dtPrev) + ', vencimento ' + U.br(r.dtVenc) });
  }
  return issues;
}

/* ---------- diagnóstico do arquivo ---------- */
function diagnose(parsedFiles, mapping, built, settings, base) {
  const recs = enrich(built.records, settings, base);
  const out = { files: parsedFiles.map(p => ({ name: p.fileName, sheet: p.sheetName, sheets: p.sheets, headerLine: p.headerIdx + 1, nRows: p.rows.length })), n: recs.length, ignored: built.ignored.length };
  const pf = parsedFiles[0]; const headers = (pf.rows[pf.headerIdx] || []).map(h => P.text(h));
  const m = mapping[pf.fileName] || mapping.__default;
  out.columns = headers.map((h, j) => {
    const vals = recs.map(r => r.raw[h]).filter(v => v != null && String(v).trim() !== '');
    const fld = FIELDS.find(f => m[f.id] === j);
    return { h, fill: vals.length, pct: recs.length ? vals.length / recs.length : 0, distinct: new Set(vals.map(String)).size, sample: [...new Set(vals.map(v => String(v)))].slice(0, 4), field: fld ? fld.label : '' };
  });
  const dates = recs.flatMap(r => [r.dtVenc, r.dtPrev, r.dtPag, r.dtLanc, r.dtComp]).filter(Boolean).sort();
  out.period = dates.length ? [dates[0], dates[dates.length - 1]] : null;
  const cnt = (fn) => { const m = new Map(); for (const r of recs) { const k = fn(r) || '(vazio)'; m.set(k, (m.get(k) || 0) + 1); } return [...m.entries()].sort((a, b) => b[1] - a[1]); };
  out.situacao = cnt(r => r.situacao).map(([k, n]) => ({ k, n, norm: settings.statusMap[k] || guessStatus(k), valor: U.sum(recs.filter(r => (r.situacao || '(vazio)') === k), r => r.valor) }));
  out.tipo = cnt(r => r.tipo).map(([k, n]) => ({ k, n, norm: settings.tipoMap[k] || guessTipo(k), valor: U.sum(recs.filter(r => (r.tipo || '(vazio)') === k), r => r.valor) }));
  out.origem = recs.some(r => r.origem) ? cnt(r => r.origem).map(([k, n]) => ({ k, n, norm: k === '(vazio)' ? '' : classifyKind({ origem: k, categoria: '', tipo: '' }, settings) === 'transferencia' ? 'Transferência entre contas' : classifyKind({ origem: k, categoria: '', tipo: '' }, settings) === 'saldo' ? 'Saldo inicial da conta' : 'Lançamento comum (usa o Tipo)', valor: U.sum(recs.filter(r => (r.origem || '(vazio)') === k), r => r.valorRaw) })) : null;
  out.conta = cnt(r => aliasOf(r.conta, settings)).map(([k, n]) => ({ k, n, cnpj: (settings.accounts[k] || {}).cnpj || guessCnpj(k), type: (settings.accounts[k] || {}).type || guessAcctType(k) }));
  out.mes = cnt(r => U.month(r.effDate || r.dueDate || r.dtLanc)).sort((a, b) => String(a[0]).localeCompare(String(b[0])));
  out.categoria = cnt(r => r.categoria);
  out.centro = cnt(r => r.centroCusto);
  out.missing = FIELDS.filter(f => m[f.id] == null).map(f => f.label);
  out.issues = findIssues(recs);
  out.pend = cnt(r => r.pend.join(' | ')).filter(([k]) => k !== '(vazio)');
  return out;
}

/* ---------- obras e contratos ----------
   Receita: lançado no Conta Azul = recebido (realizado) + a receber (em aberto); não é faturamento (NF),
   que não vem no extrato e é informado pela CM. Custos: despesas com o centro de custo da obra, agrupadas
   pela CATEGORIA do Conta Azul (nunca pelo nome do fornecedor). O que não tem centro de custo de obra
   fica em "não alocado" e torna a margem provisória. */
const COST_GROUPS = [
  ['Tributos e retenções', /imposto|\biss\b|inss retid|retid|\bdas\b|\bpis\b|cofins|csll|irrf|darf/],
  ['Mão de obra e pessoal', null], // classe de folha (ver r.folha), exceto pró-labore
  ['Materiais', /materia|tinta|\bepi\b|ferrament|equipament/],
  ['Terceiros e serviços', /servic|terceir|locac|aluguel|entulho|frete|\bart\b|crea|empreit|autonom/],
];
const COST_GROUP_ORDER = ['Materiais', 'Mão de obra e pessoal', 'Terceiros e serviços', 'Tributos e retenções', 'Outras despesas'];
function costGroup(r) {
  const c = U.key(r.categoria);
  if (COST_GROUPS[0][1].test(c)) return COST_GROUPS[0][0];
  if (r.folha && r.folha !== 'Não é folha' && r.folha !== 'Pró-labore') return COST_GROUPS[1][0];
  for (const [g, re] of COST_GROUPS.slice(2)) if (re.test(c)) return g;
  return 'Outras despesas';
}
const NOT_OBRA = /^(administrativo|socios|obras? a identificar|despesas a identificar)$/;
function centroNatureza(centro, settings) {
  const cc = (settings.centroCnpj || {})[centro] || {};
  if (cc.natureza) return { nat: cc.natureza, src: 'informado' };
  if (!centro) return { nat: 'sem centro', src: '' };
  return { nat: NOT_OBRA.test(U.key(centro)) ? (/identificar/.test(U.key(centro)) ? 'a identificar' : 'administrativo') : 'obra', src: 'sugestão pelo nome' };
}
function obraStats(recs, settings) {
  const L = recs.filter(r => (r.k === 'receita' || r.k === 'despesa') && r.st !== 'cancelado');
  const by = U.groupBy(L, r => r.centroCusto || '');
  const obras = []; const naoAloc = { rec: [], desp: [] };
  for (const [centro, l] of by) {
    const nat = centroNatureza(centro, settings);
    if (nat.nat !== 'obra') { naoAloc.desp.push(...l.filter(r => r.k === 'despesa' && nat.nat !== 'administrativo')); naoAloc.rec.push(...l.filter(r => r.k === 'receita')); continue; }
    const rec = l.filter(r => r.k === 'receita'), dsp = l.filter(r => r.k === 'despesa');
    const recebido = U.sum(rec.filter(r => r.st === 'realizado'), r => r.valor), aReceber = U.sum(rec.filter(r => r.open), r => r.openAmt);
    const pago = U.sum(dsp.filter(r => r.st === 'realizado'), r => r.valor), aPagar = U.sum(dsp.filter(r => r.open), r => r.openAmt);
    const grupos = {}; for (const r of dsp) { const g = costGroup(r); const v = r.st === 'realizado' ? r.valor : r.openAmt; grupos[g] = U.r2((grupos[g] || 0) + (v || 0)); }
    const info = (settings.obras || {})[centro] || {};
    const lancado = U.r2(recebido + aReceber), custo = U.r2(pago + aPagar);
    const cnpjs = [...new Set(l.map(r => r.cnpj).filter(Boolean))];
    const o = { centro, nat, cnpjs, recebido, aReceber, lancado, pago, aPagar, custo, grupos, rec, dsp, info,
      contratado: info.contratado != null && info.contratado !== '' ? +info.contratado : null,
      faturado: info.faturado != null && info.faturado !== '' ? +info.faturado : null,
      orcamento: info.orcamento != null && info.orcamento !== '' ? +info.orcamento : null,
      aIdent: dsp.filter(r => r.aIdent) };
    o.resultado = U.r2(lancado - custo);
    o.margem = lancado ? o.resultado / lancado : null;
    o.naoLancado = o.contratado != null ? U.r2(o.contratado - lancado) : null;
    o.difOrc = o.orcamento != null ? U.r2(o.orcamento - custo) : null;
    obras.push(o);
  }
  obras.sort((a, b) => b.lancado - a.lancado);
  const naoAlocDesp = U.sum(naoAloc.desp, r => r.st === 'realizado' ? r.valor : r.openAmt);
  const totCusto = U.sum(obras, o => o.custo);
  // margem provisória quando há custo não alocado relevante (acima de 5% do custo alocado) ou contrato não informado
  for (const o of obras) {
    const why = [];
    if (o.contratado == null) why.push('valor do contrato não informado');
    if (naoAlocDesp > 0.05 * (totCusto || 1)) why.push('há ' + U.money(naoAlocDesp) + ' de despesas sem obra (Obras a identificar / sem centro) que podem ser desta obra');
    if (o.aIdent.length) why.push(o.aIdent.length + ' despesa(s) da obra aguardando identificação');
    if (!o.grupos['Mão de obra e pessoal']) why.push('sem mão de obra alocada à obra (folha costuma estar sem centro de custo de obra)');
    o.provisorio = why;
  }
  return { obras, naoAloc, naoAlocDesp };
}
/* atividade das obras SÓ no mês (receita/despesa/resultado realizados), pra comparar obras entre si mês a mês.
   obraStats() acima é acumulado da vida do contrato; esta função é o recorte mensal do Fechamento. */
function obraMonthStats(all, settings, ym, cnpj) {
  const R = byCnpj(all, cnpj).filter(r => r.st !== 'cancelado');
  const first = ym + '-01', last = U.endOfMonth(first);
  const inM = d => d && d >= first && d <= last;
  const real = R.filter(r => r.st === 'realizado' && inM(r.effDate) && !r.futReal && (r.k === 'receita' || r.k === 'despesa'));
  const by = U.groupBy(real, r => r.centroCusto || '');
  const obras = [];
  for (const [centro, l] of by) {
    const nat = centroNatureza(centro, settings);
    if (nat.nat !== 'obra') continue;
    const rec = U.sum(l.filter(r => r.k === 'receita'), r => r.valor), desp = U.sum(l.filter(r => r.k === 'despesa'), r => r.valor);
    const grupos = {}; for (const r of l) if (r.k === 'despesa') { const g = costGroup(r); grupos[g] = U.r2((grupos[g] || 0) + r.valor); }
    obras.push({ centro, rec, desp, res: U.r2(rec - desp), n: l.length, grupos, l });
  }
  obras.sort((a, b) => (b.rec + b.desp) - (a.rec + a.desp));
  return obras;
}
function obrasResumoCard() {
  const O = obraStats(recs(), S.settings); const L = O.obras;
  if (!L.length) return '';
  const top = [...L].sort((a, b) => Math.abs(b.resultado) - Math.abs(a.resultado)).slice(0, 5);
  const maxAbs = Math.max(1, ...top.map(o => Math.abs(o.resultado)));
  return `<div class="card"><div class="ch"><h3>Rentabilidade das obras</h3><a href="#obras">Ver todas (${L.length}) ›</a></div>${stable([
    { l: 'Obra', f: o => U.esc(o.centro) },
    { l: 'Lançado', n: true, f: o => U.money(o.lancado) },
    { l: 'Resultado', n: true, f: o => `<b class="${o.resultado < 0 ? 'neg' : 'pos'}">${U.money(o.resultado)}</b>` },
    { l: 'Margem', n: true, f: o => o.margem == null ? '—' : U.pct(o.margem) + (o.provisorio.length ? ' <span class="conf estimado">provisória</span>' : '') },
    { l: '', f: o => `<div class="bar"><i class="${o.resultado < 0 ? 'neg' : 'pos'}" style="width:${Math.min(100, Math.abs(o.resultado) / maxAbs * 100)}%"></i></div>` },
  ], top)}<p class="small">Top ${top.length} por maior impacto (lucro ou prejuízo). Lançado = recebido + a receber; a margem é provisória enquanto houver dados pendentes da obra.</p></div>`;
}

/* números do mês (realizado pela data efetiva; previsto pelo vencimento original) */
function monthStats(all, settings, ym, cnpj) {
  const R = byCnpj(all, cnpj).filter(r => r.st !== 'cancelado');
  const first = ym + '-01', last = U.endOfMonth(first);
  const inM = d => d && d >= first && d <= last;
  // quitado com data posterior à data-base não conta como realizado
  const real = R.filter(r => r.st === 'realizado' && inM(r.effDate) && !r.futReal);
  const op = R.filter(r => r.k === 'receita' || r.k === 'despesa');
  const rec = U.sum(real.filter(r => r.k === 'receita'), r => r.valor), desp = U.sum(real.filter(r => r.k === 'despesa'), r => r.valor);
  const transf = real.filter(r => r.k === 'transferencia');
  const prevRec = U.sum(op.filter(r => r.k === 'receita' && inM(r.dtVenc || r.dueDate)), r => r.orig), prevDesp = U.sum(op.filter(r => r.k === 'despesa' && inM(r.dtVenc || r.dueDate)), r => r.orig);
  const abertosVenc = op.filter(r => r.open && r.dueDate && r.dueDate <= last);
  const bals = accountBalances(all, settings, last).filter(b => cnpj === 'C' || b.cnpj === cnpj);
  const porCat = groupSum(real.filter(r => r.k === 'despesa'), r => r.categoria || '(sem categoria)');
  const porCatReceita = groupSum(real.filter(r => r.k === 'receita'), r => r.categoria || '(sem categoria)');
  const porCatAbertoRec = groupSum(abertosVenc.filter(r => r.k === 'receita'), r => r.categoria || '(sem categoria)', r => r.openAmt);
  const porCatAbertoDesp = groupSum(abertosVenc.filter(r => r.k === 'despesa'), r => r.categoria || '(sem categoria)', r => r.openAmt);
  return { ym, first, last, rec, desp, res: U.r2(rec - desp), nReal: real.length, transf: U.sum(transf, r => r.sign * r.valor), nTransf: transf.length,
    prevRec, prevDesp, abertosRec: U.sum(abertosVenc.filter(r => r.k === 'receita'), r => r.openAmt), abertosDesp: U.sum(abertosVenc.filter(r => r.k === 'despesa'), r => r.openAmt),
    nAbertosVenc: abertosVenc.length, abertosVenc, saldos: bals.map(b => ({ conta: b.conta, cnpj: b.cnpj, type: b.type, calc: b.calc, banco: b.opening && b.opening.data === last ? +b.opening.valor : null, cash: b.cash })),
    porCat, porCatReceita, porCatAbertoRec, porCatAbertoDesp, real };
}

/* ---------- permissões: o que cada tipo de usuário enxerga e grava ----------
   Admin (a CM) vê tudo e grava. Cliente e "dashboard" só leem: as abas operacionais ficam escondidas e a
   gravação no servidor também é barrada (api/index.php). Sem conseguir confirmar o papel, trata como leitura. */
let PAPEL = null;
const SOMENTE_ADMIN = new Set(['lancamentos', 'importacao', 'config', 'backup', 'empreitas']);
const isAdmin = () => PAPEL === 'admin';
const NAV_ALIAS = { calendario: 'fluxo', alertas: 'painel', rotina: 'painel', conciliacao: 'painel' }; // links antigos
function navTarget(v) { if (v === 'calendario') S.ui.fluxoVis = 'cal'; return NAV_ALIAS[v] || v; }
function podeVer(id) { return NAV.some(n => n[0] === id) && (isAdmin() || !SOMENTE_ADMIN.has(id)); }
async function detectarPapel() {
  try {
    const r = await fetch('/api/login', { headers: { Authorization: authHeader } });
    if (r.status === 401) { location.href = '../index.html'; return; }
    PAPEL = ((await r.json()) || {}).papel || null;
  } catch (e) { PAPEL = null; }
  document.body.classList.toggle('nao-admin', !isAdmin());
}

/* ---------- persistência: base própria da CM (mesmo login do portal) ----------
   Página servida dentro do portal administrativo: usa a mesma sessão (usuário/senha)
   já autenticada ali — sem token separado. Store.set() grava o pacote inteiro
   (settings + versions + activeId) em /api/relatorio-dados, e uma verificação
   periódica detecta se outra pessoa importou algo nesse meio-tempo. */
const RELATORIO_ID = 'premium-pinturas-fechamento-visao-geral';
const authHeader = localStorage.getItem('cm_admin_auth') || sessionStorage.getItem('cm_admin_auth') || '';
if (!authHeader) location.href = '../index.html';
const Store = {
  ok: false, remoteErr: null, cache: null, cacheAt: null, lastPushAt: 0, onRemoteChange: null,
  async open() {
    await detectarPapel();
    try {
      await this.pullRemote();
      this.ok = true;
      setInterval(() => this.checkRemote(), 20000);
    } catch (e) {
      console.warn(e);
      this.remoteErr = 'Base da CM indisponível neste momento: ' + (e.message || e);
    }
  },
  async pullRemote() {
    const r = await fetch(`/api/relatorio-dados?id=${encodeURIComponent(RELATORIO_ID)}`, { headers: { Authorization: authHeader } });
    if (r.status === 401) { location.href = '../index.html'; throw new Error('sessão expirada'); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const body = await r.json();
    this.cache = body.dados || {};
    this.cacheAt = body.atualizadoEm || null;
  },
  async get(k) { return this.cache ? this.cache[k] : undefined; },
  async set(k, v) {
    if (!this.cache) this.cache = {};
    this.cache[k] = v;
    if (!isAdmin()) return; // só a CM grava; para os demais a alteração vale só nesta tela
    try { await this.pushRemote(); } catch (e) { console.error(e); if (typeof toast === 'function') toast('Não foi possível salvar na base da CM: ' + (e.message || e), true); throw e; }
  },
  async pushRemote() {
    const r = await fetch(`/api/relatorio-dados?id=${encodeURIComponent(RELATORIO_ID)}`, {
      method: 'PUT', headers: { Authorization: authHeader, 'Content-Type': 'application/json' }, body: JSON.stringify(this.cache),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const body = await r.json();
    this.cacheAt = body.atualizadoEm || null; this.lastPushAt = Date.now();
  },
  // verifica periodicamente se outra pessoa importou/alterou dados nesse meio-tempo
  async checkRemote() {
    if (!this.ok) return;
    try {
      const before = this.cacheAt;
      await this.pullRemote();
      if (this.cacheAt && this.cacheAt !== before && Date.now() - this.lastPushAt > 5000) {
        this.onRemoteChange && this.onRemoteChange();
      }
    } catch (e) { console.warn('checkRemote', e); }
  },
  async estimate() { return null; },
  async persist() { return true; },
};

/* ==========================================================================
   Aplicação: estado, navegação e componentes (tabela, modal, gráfico)
   ========================================================================== */
const S = {
  settings: null, versions: [], activeId: null,
  ui: { view: 'painel', cnpj: 'C', base: U.today(), scenario: 'base' },
  cache: null,
};
const $ = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => [...(el || document).querySelectorAll(sel)];

function activeVersion() { return S.versions.find(v => v.id === S.activeId) || S.versions[S.versions.length - 1] || null; }
function prevVersion(v) { const i = S.versions.indexOf(v); return i > 0 ? S.versions[i - 1] : null; }

/* dados calculados da versão ativa (com cache por data-base/configuração) */
function data() {
  const v = activeVersion(); if (!v) return null;
  const sig = v.id + '|' + S.ui.base + '|' + JSON.stringify(S.settings).length + '|' + S.settingsRev;
  if (S.cache && S.cache.sig === sig) return S.cache;
  const all = enrich(v.records, S.settings, S.ui.base);
  const balances = accountBalances(all, S.settings, S.ui.base);
  S.cache = { sig, v, all, balances, proj: {}, saldoCheck: reportSaldoCheck(all) };
  return S.cache;
}
function projFor(cnpj, scen) {
  const D = data(); const k = cnpj + '|' + (scen || 'base');
  if (!D.proj[k]) D.proj[k] = project(D.all, S.settings, S.ui.base, cnpj, { balances: D.balances, scenario: S.settings.scenarios[scen || 'base'], days: 400 });
  return D.proj[k];
}
function recs() { const D = data(); return D ? byCnpj(D.all, S.ui.cnpj) : []; }
/* saldo projetado por conta e por dia (mesmo motor de projFor, só reagrupado por conta em vez de somado) */
function accountProjection(cnpj, scen, maxContas) {
  const pj = projFor(cnpj, scen);
  const parts = pj.start.parts;
  const moves = pj.moves.concat(pj.internal).filter(m => m.r && m.r.conta);
  const byDayAcc = U.groupBy(moves, m => m.date + '|' + m.r.conta);
  const bal = {}; parts.forEach(p => bal[p.conta] = p.valor || 0);
  const days = pj.days.map(day => {
    const byAcct = {};
    for (const p of parts) { const ms = byDayAcc.get(day.d + '|' + p.conta) || []; bal[p.conta] = U.r2(bal[p.conta] + U.sum(ms, m => m.amt)); byAcct[p.conta] = bal[p.conta]; }
    return { d: day.d, byAcct };
  });
  const max = maxContas || 5;
  if (parts.length <= max) return { names: parts.map(p => p.conta), days };
  const ranked = [...parts].sort((a, b) => Math.abs(b.valor || 0) - Math.abs(a.valor || 0));
  const top = ranked.slice(0, max).map(p => p.conta), rest = ranked.slice(max).map(p => p.conta);

   cur/prev vêm de groupSum (carregam .l, a lista de lançamentos): cada categoria é clicável pra detalhar. */
function catCompareBlock(titulo, cur, prev, cls, opt) {
  opt = opt || {};
  if (!cur.length) return `<p class="small muted-t">Nenhuma ${titulo.toLowerCase()} realizada no mês.</p>`;
  const cmp = compareCat(cur, prev);

  return hbar2(cur.slice(0, 12).map(x => ({ label: x.k, value: x.v, extra: x.n + ' lanç.', cls })), { valueWidth: 132 }) + collapsibleTable(cols, cmp, { limit: opt.limit || 5 });
}
function abertoBlock(titulo, aberto) {
  return `<div class="card"><h3>${titulo} em aberto (projeção)</h3>${aberto.length ? hbar2(aberto.slice(0, 12).map(x => ({ label: x.k, value: x.v, extra: x.n + ' lanç.', cls: 'wftot' })), { valueWidth: 132 }) + collapsibleTable([{ l: 'Categoria', k: 'k' }, { l: 'Lanç.', n: true, f: x => x.n }, { l: 'Em aberto', n: true, f: x => U.money(x.v) }], aberto, { limit: 5 }) : '<p class="small muted-t">Nada em aberto.</p>'}</div>`;

/* monthStats dos últimos n meses terminando em ym (inclusive), do mais antigo pro mais novo */
function monthSeries(all, settings, ym, n, cnpj) {
  const months = []; let cur = ym;
  for (let i = 0; i < n; i++) { months.unshift(cur); cur = U.month(U.addDays(cur + '-01', -1)); }
  return months.map(m => monthStats(all, settings, m, cnpj));
}
/* cascata "formação do resultado de caixa" a partir de um monthStats(). Usa a mesma classificação de folha do resto do sistema. */
function wfStepsCaixa(st) {
  if (!st.nReal) return [];
  const desps = (st.real || []).filter(r => r.k === 'despesa');
  const despFolha = U.r2(U.sum(desps.filter(r => r.folha && r.folha !== 'Não é folha'), r => r.valor));
  const despOutras = U.r2(st.desp - despFolha);
  const steps = [{ label: 'Recebido', value: st.rec }];
  if (despFolha) steps.push({ label: 'Folha e pessoal', value: -despFolha });
  if (despOutras) steps.push({ label: 'Outras despesas', value: -despOutras });
  steps.push({ label: 'Resultado de caixa', value: st.res, total: true });
  return steps;
}
/* cascata do fechamento: cai pro caixa realizado e, se proj=true, continua com o que ainda está em aberto */
function wfStepsBalanco(st, proj) {
  const base = wfStepsCaixa(st);
  if (!proj || !base.length) return base;
  const steps = base.slice(0, -1);
  steps.push({ label: 'Resultado de caixa', value: st.res, total: true });
  if (st.abertosRec) steps.push({ label: 'A receber em aberto', value: st.abertosRec });
  if (st.abertosDesp) steps.push({ label: 'A pagar em aberto', value: -st.abertosDesp });
  steps.push({ label: 'Resultado projetado', value: U.r2(st.res + st.abertosRec - st.abertosDesp), total: true });
  return steps;
}

function scenarioText(sc) {
  sc = Object.assign(emptyScenario(), sc || {});
  const t = [];
  if (sc.atrasoRec) t.push('recebimentos +' + sc.atrasoRec + ' dias');
  if (sc.antecipaRec) t.push('recebimentos antecipados ' + sc.antecipaRec + ' dias');
  if (sc.perdaRec) t.push(sc.perdaRec + '% dos recebimentos não realizados');
  if (sc.aumentoCustos) t.push('custos ' + (sc.aumentoCustos > 0 ? '+' : '') + sc.aumentoCustos + '%');
  if (sc.adiarPag) t.push('pagamentos +' + sc.adiarPag + ' dias');
  (sc.extras || []).filter(x => +x.valor && x.data).forEach(x => t.push((x.valor < 0 ? 'saída ' : 'entrada ') + U.money(Math.abs(x.valor)) + ' em ' + U.br(x.data) + ' (' + U.esc(x.desc || 'sem descrição') + (x.cnpj ? ', CNPJ ' + x.cnpj : '') + ')'));
  (sc.shifts || []).filter(x => x.key && x.data).forEach(x => t.push('lançamento ' + U.esc(x.desc || x.key) + ' movido para ' + U.br(x.data)));
  return (t.length ? t.join('; ') : 'nenhuma (dados do Conta Azul como estão)') + (sc.premissa ? '. Justificativa: ' + U.esc(sc.premissa) : '');
}
function riskChangeHtml(pv) {
  const prevAll = enrich(pv.records, S.settings, S.ui.base);
  const pp = project(prevAll, S.settings, S.ui.base, S.ui.cnpj, { scenario: S.settings.scenarios[S.ui.scenario], days: 400 });
  const cur = projFor(S.ui.cnpj, S.ui.scenario);
  const eom = U.endOfMonth(S.ui.base); const d30 = U.addDays(S.ui.base, 30);
  const at = (p, d) => (p.days.find(x => x.d === d) || {}).fim;
  const rows = [
    { l: 'Saldo inicial', a: pp.start.total, b: cur.start.total },
    { l: 'Saldo projetado em ' + U.br(eom), a: at(pp, eom), b: at(cur, eom) },
    { l: 'Saldo projetado em ' + U.br(d30), a: at(pp, d30), b: at(cur, d30) },

  return stable([{ l: 'Indicador', k: 'l' }, { l: 'Base anterior (recalculada hoje)', n: true, f: r => U.money(r.a) }, { l: 'Base atual', n: true, f: r => U.money(r.b) }, { l: 'Variação', n: true, f: r => r.a != null && r.b != null ? `<span class="${r.b - r.a < 0 ? 'neg' : 'pos'}">${U.money(r.b - r.a, { sign: 1 })}</span>` : '—' }], rows)
    + `<p>Primeira data de risco: antes <b>${pp.firstNeg ? U.br(pp.firstNeg.d) : 'nenhuma'}</b>, agora <b>${cur.firstNeg ? U.br(cur.firstNeg.d) : 'nenhuma'}</b>.${snap ? ` Projeção registrada no dia da importação anterior: saldo no fim daquele mês ${U.money(snap.eom)}, risco ${snap.firstNeg ? U.br(snap.firstNeg) : 'nenhum'}.` : ''}</p>`;
}

/* ---------- calendário ---------- */
/* saldo histórico (realizado) por dia, pra preencher o calendário em meses anteriores à data-base
   (a projeção de projFor só cobre dias >= data-base) */
function historicalDailyBalance(cnpj, fromDay, base) {
  const map = new Map();
  if (fromDay > base) return map;
  const sb = startingBalance(data().balances, cnpj, base);
  const R = byCnpj(data().all, cnpj).filter(r => r.isCash && r.st === 'realizado' && r.effDate && r.effDate > fromDay && r.effDate <= base);
  const byDay = U.groupBy(R, r => r.effDate);
  let bal = sb.total;
  for (let d = base; d > fromDay; d = U.addDays(d, -1)) {
    const net = U.sum(byDay.get(d) || [], r => r.sign * r.valor);
    bal = U.r2(bal - net);
    map.set(U.addDays(d, -1), bal);
  }
  return map;
}

/* ---------- a receber / a pagar ---------- */
function horizonFilter(list, h) {
  const b = S.ui.base;
  if (!h || h === 'todos') return list;
  const due = r => r.dueDate;
  if (h === 'vencidos') return list.filter(r => r.overdue);
  if (h === '7') return list.filter(r => due(r) && due(r) <= U.addDays(b, 7));
  if (h === '15') return list.filter(r => due(r) && due(r) <= U.addDays(b, 15));
  if (h === '30') return list.filter(r => due(r) && due(r) <= U.addDays(b, 30));
  if (h === 'mes') return list.filter(r => due(r) && due(r) <= U.endOfMonth(b));
  if (h === 'seguintes') return list.filter(r => due(r) && due(r) > U.endOfMonth(b));
  return list;
}
