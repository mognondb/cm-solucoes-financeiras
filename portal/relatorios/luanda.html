<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fechamento Financeiro CM</title>
<link rel="icon" href="../../assets/img/clientes/instituto-luanda-simbolo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>:root{
  --bg:#f7f4ee; --surface:#ffffff; --surface-2:#fbf9f5; --line:#e8e1d3; --line-2:#f2ede3;
  --ink:#2e342c; --ink-2:#4d5749; --ink-3:#6c7467; --ink-4:#a2a796;
  --nav:#4b5646; --nav-2:#57634f; --nav-ink:#efeadf; --nav-ink-2:#cfc6ae;
  --brand:#5d6858; --brand-2:#ad7f27; --brand-soft:#f6eedd; --gold:#ad7f27; --gold-soft:#d7b977; --olive:#646e5f; --rose:#d98b98; --lilac:#a98bc4;
  --s1:#6f8f74; --s2:#c96f7d; --s3:#ad7f27; --s4:#d9a43a; --s7:#8e72b0;
  --good:#4f8a4f; --warn:#d9a43a; --serious:#cf7b52; --crit:#b4473f;
  --good-bg:#eaf2e6; --warn-bg:#fbf1dc; --serious-bg:#f9e9df; --crit-bg:#f8e5e2;
  --radius:10px; --shadow:0 1px 2px rgba(60,50,30,.05),0 1px 3px rgba(60,50,30,.06); --serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--crit)}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.hidden{display:none!important}

/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.brand .logo{display:flex;align-items:center;gap:10px;font-weight:700;color:#fff;font-size:15px;letter-spacing:.2px}
.brand .logo i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#ad7f27,#6f8f74);display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff}
.brand small{display:block;color:var(--nav-ink-2);font-size:11px;margin-top:4px}
.side .ctx{padding:14px 18px;display:grid;gap:10px;border-bottom:1px solid rgba(255,255,255,.06)}
.side label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--nav-ink-2);display:block;margin-bottom:4px}
.side select{width:100%;background:var(--nav-2);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 10px;color:#fff}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--nav-ink-2);padding:12px 10px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--nav-ink);font-size:13.5px}
.nav button:hover{background:var(--nav-2);color:#fff}
.nav button.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--gold-soft)}
.nav button .ic{width:18px;text-align:center;opacity:.85}
.nav button .badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;line-height:18px}
.side .foot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.06);font-size:11.5px;color:var(--nav-ink-2)}
.side .foot label{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:12px;color:var(--nav-ink);cursor:pointer}
.main{min-width:0;padding:22px 28px 60px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.topbar h1{font-size:21px;margin:0 0 2px;font-weight:650;letter-spacing:-.2px}
.topbar .sub{color:var(--ink-3);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mobilebar{display:none}

/* elementos */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#d6cbb3;background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#4b5646}
.btn.danger{color:var(--crit);border-color:#f0c4c4}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel{padding:18px 20px;margin-bottom:18px}
.panel h2{font-size:15px;margin:0 0 4px;font-weight:650}
.panel h3{font-size:13.5px;margin:16px 0 8px;font-weight:650}
.panel .desc{color:var(--ink-3);font-size:12.5px;margin:0 0 14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:14px 15px 13px;position:relative;cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:var(--gold-soft)}
.kpi .lb{font-size:12px;color:var(--ink-3);font-weight:500;padding-right:20px}
.kpi .v{font-size:21px;font-weight:650;margin:5px 0 2px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--ink-3)}
.kpi .info{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);font-size:11px;display:grid;place-items:center;color:var(--ink-3);background:var(--surface)}
.kpi.grp-nop{background:linear-gradient(0deg,#fbfbfd,#fff)}
.kpi .tag{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:4px;background:var(--line-2);color:var(--ink-2);margin-left:4px}
.secttl{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);margin:6px 0 8px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--good-bg);color:#3c6e3c}
.pill.warn{background:var(--warn-bg);color:#8a5d00}
.pill.serious{background:var(--serious-bg);color:#a8461f}
.pill.crit{background:var(--crit-bg);color:#9a3a33}
.pill.info{background:var(--brand-soft);color:#7d5c18}
.pill.gray{background:var(--line-2);color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.alert{border-radius:8px;padding:10px 13px;margin:0 0 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:var(--warn-bg);border:1px solid #f6dc9c}
.alert.crit{background:var(--crit-bg);border:1px solid #f1c2c2}
.alert.info{background:var(--brand-soft);border:1px solid #ecdcb8}
.alert.ok{background:var(--good-bg);border:1px solid #bfe5bf}
.alert b{font-weight:650}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}

/* tabelas */
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:560px;
  background: linear-gradient(to right, var(--surface) 30%, rgba(0,0,0,0)), linear-gradient(to right, rgba(0,0,0,0), var(--surface) 70%) 100% 0, radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), rgba(0,0,0,0)), radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), rgba(0,0,0,0)) 100% 0;
  background-repeat: no-repeat; background-color: var(--surface);
  background-size: 28px 100%, 28px 100%, 10px 100%, 10px 100%;
  background-position: 0 0, 100% 0, 0 0, 100% 0;
  background-attachment: local, local, scroll, scroll;
}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:#f6f2ea;text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
table.t th.r,table.t td.r{text-align:right}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.t tr:hover td{background:#fcfaf6}
table.t tr.tot td{font-weight:650;background:#f6f2ea;border-top:1px solid var(--line)}
table.t tr.grp td{font-weight:600;background:#faf7f1}
table.t tr.sub td:first-child{padding-left:26px;color:var(--ink-2)}
table.t th .ar{color:var(--ink-4);font-size:10px;margin-left:3px}
.tbltools{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tbltools input[type=search],.tbltools select{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff;min-width:0}
.tbltools input[type=search]{width:240px;max-width:100%}
.tbltools .cnt{margin-left:auto;color:var(--ink-3);font-size:12px}

/* formulários */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px}
.field label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:3px;font-weight:500}
.field input,.field select,.field textarea,input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff}
textarea.in{min-height:90px;resize:vertical}
input.in.sm,select.in.sm{padding:4px 6px;font-size:12.5px}

/* importação */
.drop{display:block;border:2px dashed var(--gold-soft);border-radius:12px;padding:28px;text-align:center;background:#fdfbf7;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--brand-2);background:var(--brand-soft)}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.stage{border:1px solid var(--line);border-radius:10px;margin-top:14px;overflow:hidden}
.stage .hd{display:flex;gap:12px;align-items:center;padding:12px 14px;background:#faf7f1;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stage .bd{padding:14px}
.checks{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px}
.checks li{display:flex;gap:8px;align-items:center;font-size:12.5px}
.expect{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:6px}
.expect div{display:flex;gap:8px;align-items:center;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}

/* gráficos */
.chart{width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:inherit;fill:var(--ink-3);font-size:11px}
.chart .lbl{fill:var(--ink-2);font-size:11px}
.chart .val{fill:var(--ink);font-size:11px;font-weight:600}
.chart .grid line{stroke:#efe9dd}
.chart .axis line{stroke:#d9d0bd}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:4px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
#tip{position:fixed;pointer-events:none;background:#3a4237;color:#fff;padding:7px 10px;border-radius:7px;font-size:12px;line-height:1.4;z-index:9999;max-width:300px;box-shadow:0 6px 20px rgba(0,0,0,.2);display:none}
#tip b{font-weight:600}

/* modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;z-index:500;padding:40px 16px;overflow:auto}
.modal .box{background:#fff;border-radius:12px;max-width:1100px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:15px}
.modal .mb{padding:16px 18px}
.def{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13px;margin-bottom:14px}
.def dt{color:var(--ink-3)}
.def dd{margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-size:13px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand-2);font-weight:600}
.toast{position:fixed;bottom:20px;right:20px;background:#3a4237;color:#fff;padding:10px 16px;border-radius:8px;z-index:9999;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.waterfall-note{font-size:12px;color:var(--ink-3)}
.split{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.stmt td:first-child{width:60%}
.status-sel{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px;background:#fff}

/* relatório do cliente */
#report{position:fixed;inset:0;background:#e9e4d8;z-index:400;overflow:auto;display:none}
#report.on{display:block}
#report .rbar{position:sticky;top:0;background:#4b5646;color:#fff;display:flex;gap:10px;align-items:center;padding:10px 18px;z-index:2}
#report .rbar .btn{background:#fff;color:var(--ink)}
.pages{padding:24px 0 60px;display:flex;flex-direction:column;align-items:center;gap:22px}
.page{width:297mm;min-height:209mm;height:209mm;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:13mm 15mm 10mm;position:relative;overflow:hidden;display:flex;flex-direction:column}
.page h2{font-family:var(--serif);font-size:27px;margin:0 0 3px;letter-spacing:0;color:var(--olive);font-weight:600}
.page .ps{color:#5b6573;font-size:12.5px;margin-bottom:10px}
.page .pf{position:absolute;bottom:6mm;left:15mm;right:15mm;font-size:9.5px;color:#9a9283;display:flex;justify-content:space-between;border-top:1px solid var(--gold-soft);padding-top:4px}
.page .body{flex:1;min-height:0;display:flex;flex-direction:column}
.page table.t{font-size:11.5px}
.page table.t th{position:static;font-size:11px;cursor:default}
.page table.t td{padding:5px 8px}
.page .kpis{grid-template-columns:repeat(4,1fr);gap:9px;margin:0 0 10px}
.page .kpi{cursor:default;padding:10px 12px;box-shadow:none}
.page .kpi .v{font-size:18px}
.page ul.bul{margin:6px 0;padding-left:18px;font-size:14px;line-height:1.55}
.page ul.bul li{margin-bottom:7px}
.cover{background:#fdfbf6;color:var(--olive);justify-content:center;align-items:center;text-align:center;padding:16mm}
.cover h1{font-family:var(--serif);font-weight:600;font-size:44px;margin:0 0 4px;letter-spacing:0;color:var(--olive)}
.cover .per{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
.cover .who{margin-top:10mm;font-size:12.5px;color:var(--ink-3);line-height:1.6}
.cover .pf{color:#9a9283;border-color:var(--gold-soft)}
.callouts{display:grid;gap:8px;align-content:start}
.callout{border-left:3px solid var(--gold);background:#fbf6ec;padding:8px 11px;border-radius:0 6px 6px 0;font-size:12px}
.callout b{display:block;font-size:17px;color:var(--olive)}
.rgrid{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;flex:1;min-height:0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.steps div{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px}
.steps b{display:block;font-size:13px;margin:4px 0}
.note-sm{font-size:11px;color:#6b7280;margin-top:6px}

@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 30% 0 0;max-width:290px;z-index:300;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .mobilebar{display:flex;align-items:center;gap:10px;background:var(--nav);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:200}
  .mobilebar button{all:unset;cursor:pointer;font-size:20px}
  .main{padding:16px 16px 50px}
  .g2,.g3{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:18px}
  .def{grid-template-columns:1fr}
}
@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff}
  .app,.modal,#tip,.toast,.mobilebar{display:none!important}
  #report{position:static;display:block!important;background:#fff;overflow:visible}
  #report .rbar{display:none}
  .pages{padding:0;gap:0;display:block}
  .page{box-shadow:none;width:297mm;height:209mm;min-height:209mm;page-break-after:always;break-after:page;padding:14mm 16mm 12mm}
  .page:last-child{page-break-after:auto}
  .cover,.callout,.pill,.kpi,table.t th,table.t tr.tot td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* identidade visual do cliente (Instituto Luanda Oliveira) */
.topbar h1{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--olive);letter-spacing:0}
.panel h2{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--olive);letter-spacing:0}
.empty b{font-family:var(--serif);font-size:19px;color:var(--olive)}
.secttl,.nav .sec,.side label{letter-spacing:1.6px}
.kpi .v{color:var(--ink)}
.card{border-color:var(--line)}
.panel{border-top:2px solid var(--gold-soft)}
a{color:#8a6420}
.brand .cli{display:none;background:#fdfbf6;border-radius:10px;padding:10px 10px 8px;text-align:center;margin-bottom:10px}
.brand .cli img{width:100%;max-width:170px;height:auto;display:block;margin:0 auto}
.brand.temcli .cli{display:block}
.brand.temcli .logo{font-size:12.5px;font-weight:600;color:var(--nav-ink)}
.brand.temcli .logo i{width:22px;height:22px;font-size:10px;border-radius:6px}
.cover .clogo{width:62mm;height:auto;margin-bottom:4mm}
.cover .rule{display:flex;align-items:center;gap:10px;width:120mm;margin:5mm auto;color:var(--gold)}
.cover .rule:before,.cover .rule:after{content:"";flex:1;height:1px;background:var(--gold-soft)}
.cover .lema{font-size:10.5px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
.page .marca{position:absolute;top:9mm;right:15mm;height:13mm;opacity:.95}
</style>
</head>
<body>
<div class="mobilebar"><button data-act="menu" aria-label="Menu">☰</button><b>Fechamento Financeiro</b></div>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="cli"><img id="cliLogo" alt="Instituto Luanda Oliveira"></div><div class="logo"><i>CM</i>CM Soluções Financeiras</div><small>Fechamento financeiro gerencial</small></div>
    <div class="ctx">
      <div><label for="selCli">Cliente</label><select id="selCli" data-chg="cliente"></select></div>
      <div><label for="selMes">Mês de referência</label><select id="selMes" data-chg="mes"></select></div>
    </div>
    <nav class="nav"></nav>
    <div class="foot">
      <label><input type="checkbox" id="maskChk" data-chg="mask"> Ocultar nomes de pacientes</label>
      <div id="stInfo" style="margin-top:8px"></div>
      <div style="margin-top:6px">Processamento 100% local · v1.4.3</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="report"><div class="rbar"><b>Relatório do cliente</b><span style="opacity:.7;font-size:12px">Imprimir › Salvar como PDF · paisagem · margens: nenhuma · gráficos de fundo: ligado</span><span style="margin-left:auto" class="actions"><button class="btn" data-act="print">Exportar PDF</button><button class="btn" data-act="closeReport">Fechar</button></span></div><div class="pages"></div></div>
<div id="tip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>window.LOGOS={luanda:"../../assets/img/clientes/instituto-luanda.png",luandaSimbolo:"../../assets/img/clientes/instituto-luanda-simbolo.png"};</script>
<script>/* ============================================================
   MOTOR DE CÁLCULO — Fechamento Financeiro CM
   Funções puras (sem DOM). Testáveis no Node.
   ============================================================ */
var Engine = (function () {
  'use strict';
  var XL = (typeof XLSX !== 'undefined') ? XLSX : null;
  function setXLSX(x) { XL = x; }

  /* ---------- classificação ---------- */

  /* registra subcategorias novas no mapa como pendentes (nunca define classificação definitiva sozinho) */

  /* ---------- consolidação de lotes ---------- */
  function bancoKey(l) { return l.contaKey || ('pdf:' + contaKey(l.banco + ' ' + l.conta)); }

  function vincularBancos(cli) {

  /* ---------- bases efetivas ---------- */
  function movimentos(cli) {
    var out = [];
    cli.lotes.filter(function (l) { return l.tipo === 'extrato'; }).forEach(function (l) {
      l.registros.forEach(function (r) {
        var c = classify(cli, r.subcategoria, r.categoria, r.tipoCat);
        out.push(Object.assign({}, r, { id: l.id + ':' + r.linha, loteId: l.id, conta: l.conta, contaKey: l.contaKey || contaKey(l.conta), natureza: c.natureza, grupo: c.grupo, classPendente: c.pendente }));
      });

    out.sort(function (a, b) { return a.data < b.data ? -1 : a.data > b.data ? 1 : (a.hora < b.hora ? -1 : a.hora > b.hora ? 1 : 0); });

  function contas(cli) {

  /* para cada mês, usa o lote de Fluxo mais recente que cobre o mês (evita somar o mesmo título de dois snapshots) */
  function lotesFluxo(cli) {

  /* ---------- fechamento do mês (regime de caixa) ---------- */
  function fechamento(cli, mes) {
    var all = movimentos(cli), movs = all.filter(function (r) { return monthOf(r.data) === mes; });
    var ini = firstDay(mes), fim = lastDay(mes);
    var F = { mes: mes, movs: movs, ids: {} };
    function pick(nat) { return movs.filter(function (r) { return r.natureza === nat; }); }
    function tot(list, sign) { return r2(sign * sum(list, function (r) { return r.valor; })); }

      amo = pick('amortizacao'), apo = pick('aporte'), ret = pick('retirada'), tra = pick('transferencia'), aju = pick('saldo_inicial');
    F.receitaOp = tot(rec, 1); F.despOp = tot(desp, -1); F.resultadoOp = r2(F.receitaOp - F.despOp);
    F.margem = F.receitaOp > 0 ? F.resultadoOp / F.receitaOp : null;

    F.aportes = tot(apo, 1); F.retiradas = tot(ret, -1); F.transfNet = tot(tra, 1); F.ajustes = tot(aju, 1);
    F.resultadoCaixa = r2(F.resultadoOp - F.prolabore + F.emprestimos - F.amortizacao + F.aportes - F.retiradas + F.transfNet + F.ajustes);

    F.ids = { receitaOp: rec, despOp: desp, prolabore: pl, emprestimos: emp, amortizacao: amo, aportes: apo, retiradas: ret, transferencias: tra, ajustes: aju };
    // contas
    F.contas = contas(cli).map(function (c) {
      var ls = c.lotes.filter(function (l) { return !(l.fim < ini || l.ini > fim); });
      var m = movs.filter(function (r) { return r.contaKey === c.key; });
      var cob = ls.length && ls[0].ini <= ini && ls[ls.length - 1].fim >= fim;
      var sa = ls.length ? saldoAntes(ls[0], ini) : null;
      var ent = sum(m.filter(function (r) { return r.valor > 0 && r.natureza !== 'transferencia'; }), function (r) { return r.valor; });
      var sai = sum(m.filter(function (r) { return r.valor < 0 && r.natureza !== 'transferencia'; }), function (r) { return -r.valor; });
      var tin = sum(m.filter(function (r) { return r.valor > 0 && r.natureza === 'transferencia'; }), function (r) { return r.valor; });
      var tout = sum(m.filter(function (r) { return r.valor < 0 && r.natureza === 'transferencia'; }), function (r) { return -r.valor; });

        variacao: r2(ent - sai), saldoFinalCalc: sfc, saldoFinalInformado: sfi, confere: sfc != null && sfi != null && Math.abs(sfc - sfi) < 0.01, n: m.length };

    F.saldoFinCons = cs.every(function (c) { return c.saldoFinalInformado != null; }) ? sum(cs, function (c) { return c.saldoFinalInformado; }) : null;

  /* ---------- base própria da CM (mesmo login do portal) ----------

  var authHeader = localStorage.getItem('cm_admin_auth') || sessionStorage.getItem('cm_admin_auth') || '';

      return new Promise(function (res, rej) {

    var np = 0; try { np = ui.mes ? PEND().filter(function (p) { return (p.crit === 'crítica' || p.crit === 'alta') && p.status === 'pendente'; }).length : 0; } catch (e) { }
    side.querySelector('.nav').innerHTML = PAGES.map(function (p) { return p[0] === 'sec' ? '<div class="sec">' + p[1] + '</div>' : '<button class="' + (ui.page === p[0] ? 'on' : '') + '" data-act="go" data-page="' + p[0] + '"><span class="ic">' + p[2] + '</span>' + p[1] + (p[0] === 'pendencias' && np ? '<span class="badge">' + np + '</span>' : '') + (p[0] === 'importacao' && ui.staging.length ? '<span class="badge" style="background:var(--gold)">' + ui.staging.length + '</span>' : '') + '</button>'; }).join('');
    side.querySelector('#stInfo').innerHTML = (ui.storage === 'remoto' ? 'Dados salvos na base da CM.' : ui.storage === 'indexeddb' ? 'Dados salvos neste navegador.' : '<b style="color:#f3c1b8">Armazenamento indisponível.</b>') + ' <a href="#" data-act="go" data-page="config" style="color:#e8d3a0">Backup</a>';
  }
  function render() {
    reset();
    renderSide();
    var main = document.getElementById('main'), pg = ui.page, html;
    try {
      html = pg === 'importacao' ? X.pageImportacao() : pg === 'painel' ? pagePainel() : pg === 'fechamento' ? pageFechamento() : pg === 'pagar' ? pageTitulos('D') : pg === 'receber' ? pageTitulos('R') : pg === 'projecao' ? pageProjecao() : pg === 'comparativos' ? pageComparativos() : pg === 'cenarios' ? pageCenarios() : pg === 'pendencias' ? App4.pagePendencias() : pg === 'equilibrio' ? App4.pageEquilibrio() : pg === 'hoje' ? App4.pageHoje() : pg === 'rotina' ? App4.pageRotina() : pg === 'conciliacao' ? pageConciliacao() : pg === 'controle' ? App3.page() : pg === 'recomendacoes' ? pageRecomendacoes() : pg === 'relatorio' ? pageRelatorio() : pg === 'config' ? pageConfig() : pageAjuda();
    } catch (e) { console.error(e); html = '<div class="alert crit"><span>!</span><div><b>Erro ao montar esta tela.</b> ' + esc(e.message) + '. Os dados não foram alterados.</div></div>'; }
    var sub = ui.mes ? 'Referência: ' + M(ui.mes, true) : 'Selecione o mês de referência';
    var acts = pg === 'painel' || pg === 'relatorio' ? '<button class="btn" data-act="go" data-page="importacao">Importar relatórios</button><button class="btn pri" data-act="openReport">Relatório do cliente</button>' : '';
    main.innerHTML = '<div class="topbar"><div><h1>' + TITLES[pg] + '</h1><div class="sub">' + esc(cli().nome) + ' · ' + sub + '</div></div><div class="actions">' + acts + '</div></div>' + html;
    var drop = document.getElementById('drop');
    if (drop) {
      var fi = document.getElementById('fileIn');
      fi.addEventListener('change', function () { X.handleFiles(fi.files); });
      ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
      ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
      drop.addEventListener('drop', function (e) { if (e.dataTransfer.files.length) X.handleFiles(e.dataTransfer.files); });
    }
  }
  function bind() {
    document.addEventListener('click', function (e) {
      var s = e.target.closest('[data-sort]');
      if (s) { var p = s.dataset.sort.split('|'), cur = ui.sort[p[0]]; ui.sort[p[0]] = { k: p[1], d: cur && cur.k === p[1] ? -cur.d : 1 }; if (s.closest('.modal')) { var tb = s.closest('table'); sortDom(tb, s); } else render(); return; }
      var a = e.target.closest('[data-act]');
      if (a && A[a.dataset.act]) { if (a.tagName === 'A') e.preventDefault(); A[a.dataset.act](a); if (window.innerWidth < 860 && a.dataset.act === 'go') document.querySelector('.side').classList.remove('open'); }
    });
    document.addEventListener('change', function (e) { var el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el); });
    document.addEventListener('keydown', function (e) { var el = e.target; if (e.key === 'Enter' && el.tagName === 'INPUT' && el.type === 'text' && el.dataset && el.dataset.chg) { e.preventDefault(); el.blur(); } });
    document.addEventListener('input', function (e) {
      var el = e.target; if (!el.dataset || !el.dataset.filter) return;
      var q = E.norm(el.value), tb = document.getElementById('tb-' + el.dataset.filter), n = 0;
      tb.querySelectorAll('tbody tr:not(.tot)').forEach(function (tr) { var ok = !q || E.norm(tr.textContent).indexOf(q) >= 0; tr.style.display = ok ? '' : 'none'; if (ok) n++; });
      var c = document.getElementById('cnt-' + el.dataset.filter); if (c) c.textContent = n + ' linha(s)';
    });
    Charts.bindTips(document.body);
  }
  function sortDom(tb, th) {
    var idx = Array.prototype.indexOf.call(th.parentNode.children, th), rows = Array.prototype.slice.call(tb.querySelectorAll('tbody tr:not(.tot)')), d = th.dataset.d === '1' ? -1 : 1; th.dataset.d = d === 1 ? '1' : '-1';
    var val = function (tr) { var t = tr.children[idx].textContent.trim(), n = E.parseMoney(t.replace(/-R\$/, '-').replace('R$', '')); return n != null && /\d/.test(t) && !/\//.test(t) ? n : (/^\d{2}\/\d{2}\/\d{4}/.test(t) ? t.split(' ')[0].split('/').reverse().join('') : t.toLowerCase()); };
    rows.sort(function (a, b) { var x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * d; });
    var tot = tb.querySelector('tbody tr.tot'); rows.forEach(function (r) { tb.querySelector('tbody').insertBefore(r, tot); });
  }
  function init() {
    E.setXLSX(window.XLSX);
    bind();
    ui.mask = X.lsGet('cm_mask') === '1';
    document.getElementById('maskChk').checked = ui.mask;
    var go = function (st) {
      X.S = st && st.clientes ? st : E.novoEstado();
      Object.keys(X.S.clientes).forEach(function (k) { var c = X.S.clientes[k], base = E.novoCliente(c.nome); Object.keys(base).forEach(function (f) { if (c[f] == null) c[f] = base[f]; }); Object.keys(base.mapa).forEach(function (m) { if (!c.mapa[m]) c.mapa[m] = base.mapa[m]; }); });
      Object.keys(X.S.clientes).forEach(function (k) { var c = X.S.clientes[k], bp = E.novoCliente(c.nome).premissas; c.lotes = c.lotes.filter(function (l) { return l.tipo !== 'banco'; }); Object.keys(bp).forEach(function (f) { if (!(f in c.premissas)) c.premissas[f] = bp[f]; }); });
      var hist = E.mesesHistorico(cli()), saved = X.lsGet('cm_mes');
      ui.mes = saved || hist[hist.length - 1] || E.addMonths(new Date().toISOString().slice(0, 7), -1);
      if (!E.contas(cli()).length) ui.page = 'importacao'; else ui.page = 'hoje';
      render();
      App3.init();
    };
    X.DB.open().then(function () { return X.DB.get('estado'); }).then(go).catch(function () { ui.storage = 'memoria'; go(null); });
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(function (p) { ui.persist = p; }).catch(function () { });
    X.onRemoteChange = function () {
      X.DB.get('estado').then(function (st) {
        X.S = st && st.clientes ? st : X.S;
        render();
        X.toast('Dados atualizados na base da CM (outra importação foi feita)');
      }).catch(function () { });
    };
  }
  return { render: render, renderSide: renderSide, init: init, buildReport: buildReport, _ui: ui };
})();
</script>
