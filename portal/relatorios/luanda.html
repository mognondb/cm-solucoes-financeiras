VIEWS.conciliacao = function (main) {
  const R = recs();
  const kindSel = S.ui.concKind || 'despesa';
  const all = R.filter(r => r.k === kindSel).map(reconcile).filter(Boolean);
  const open = R.filter(r => r.k === kindSel && r.open);
  const filt = S.ui.concFilt || 'div';
  const sets = {
    div: ['Com diferença de valor', all.filter(o => o.var != null && Math.abs(o.var) >= 0.01)],
    naojust: ['Diferenças não justificadas', all.filter(o => o.status === 'Diferença não justificada')],
    menor: ['Pagos a menor', all.filter(o => o.flags.includes('a menor'))],
    atraso: ['Em atraso sem diferença', all.filter(o => o.status === 'Pago em atraso sem diferença')],
    antec: ['Antecipados', all.filter(o => o.flags.includes('antecipado'))],
    parcial: ['Parciais', all.filter(o => o.status === 'Pagamento parcial')],
    encargos: ['Com encargos registrados', all.filter(o => o.r.juros || o.r.multa || o.r.taxas || o.r.desconto)],
    valid: ['Pendentes de validação', all.filter(o => o.status === 'Pendente de validação')],
    todos: ['Todos os quitados', all],
  };
  const semPag = open.filter(r => r.overdue);
  let html = head('Previsto x efetivamente pago', scopeNote() + ' · Variação = valor efetivamente pago − valor original previsto', `<div class="seg"><button class="${kindSel === 'despesa' ? 'on' : ''}" onclick="S.ui.concKind='despesa';render()">Pagamentos</button><button class="${kindSel === 'receita' ? 'on' : ''}" onclick="S.ui.concKind='receita';render()">Recebimentos</button></div>`);
  html += `<div class="kpis">${Object.entries(sets).map(([k, [l, L]]) => `<div class="kpi click ${filt === k ? 'sel' : ''}" onclick="S.ui.concFilt='${k}';render()"><div class="kl">${l}</div><div class="kv">${L.length}</div><div class="kp">variação ${U.money(U.sum(L, o => o.var))}</div></div>`).join('')}
    <div class="kpi click" data-drill="${drillId('Vencidos sem pagamento identificado', semPag, COLS.pagar())}"><div class="kl">Vencidos sem pagamento</div><div class="kv">${semPag.length}</div><div class="kp">${U.money(U.sum(semPag, r => r.openAmt))}</div></div></div>`;
  html += `<div class="banner small">Uma diferença positiva não é tratada automaticamente como juros ou multa: só é "explicada pelos encargos" quando os campos Juros, Multa, Taxas e Desconto do relatório fecham exatamente a diferença. O relatório do Conta Azul traz o pagamento no próprio lançamento; um pagamento é ligado a uma obrigação apenas quando é o mesmo lançamento (não por semelhança).</div>`;
  html += `<div class="card"><h3>${sets[filt][0]}</h3><div id="tbl"></div></div>`;
  // resumos mensal e semanal
  const sumBy = (fn) => [...U.groupBy(all.filter(o => o.r.effDate), o => fn(o.r.effDate)).entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([k, l]) => {
    const dv = l.filter(o => o.var != null && Math.abs(o.var) >= 0.01);
    return { k, n: l.length, ndiv: dv.length, vdiv: U.sum(dv, o => o.var), enc: U.sum(l.filter(o => o.status === 'Diferença explicada pelos encargos'), o => o.enc), pend: U.sum(l.filter(o => o.status === 'Diferença não justificada' || o.status === 'Pendente de validação'), o => o.var || 0), _drill: drillId('Quitados em ' + k, l.map(o => o.r), COLS.pagar()) };
  });
  const cols = (lab) => [{ l: lab, k: 'k' }, { l: 'Quitados', n: true, f: r => r.n }, { l: 'Divergentes', n: true, f: r => r.ndiv }, { l: 'Total das diferenças', n: true, f: r => U.money(r.vdiv) }, { l: 'Encargos confirmados', n: true, f: r => U.money(r.enc) }, { l: 'Pendente de análise', n: true, f: r => U.money(r.pend) }];
  html += `<div class="grid2"><div class="card"><h3>Resumo mensal</h3>${stable(cols('Mês'), sumBy(d => U.month(d)).map(x => ({ ...x, k: U.monthLabel(x.k) })), { cls: 'click' })}</div>
    <div class="card"><h3>Resumo semanal</h3>${stable(cols('Semana (seg)'), sumBy(d => U.weekStart(d)).slice(-13).map(x => ({ ...x, k: U.br(x.k) })), { cls: 'click' })}</div></div>`;
  main.innerHTML = html;
  mountTable($('#tbl'), {
    id: 'conc' + filt + kindSel, name: 'previsto_x_pago', rows: sets[filt][1].map(o => Object.assign({}, o.r, { _o: o })), sort: 'var', dir: -1, cols: [
      { k: 'pessoa', l: kindSel === 'despesa' ? 'Fornecedor' : 'Cliente', s: r => r.pessoa },
      { k: 'descricao', l: 'Descrição', s: r => r.descricao, cls: 'wrap' },
        { k: 'categoria', l: 'Categoria', s: r => r.categoria }, { k: 'centroCusto', l: 'Centro de custo', s: r => r.centroCusto },
      { k: 'orig', l: 'Valor original', n: true, f: r => U.money(r._o.orig), s: r => r._o.orig, sum: r => r._o.orig },
      { k: 'dtVenc', l: 'Vencimento', f: r => U.br(r.dtVenc), s: r => r.dtVenc || '' },
      { k: 'effDate', l: 'Pago em', f: r => U.br(r.effDate), s: r => r.effDate || '' },
      { k: 'pago', l: 'Valor pago', n: true, f: r => U.money(r._o.pago), s: r => r._o.pago, sum: r => r._o.pago },
      { k: 'var', l: 'Variação R$', n: true, f: r => r._o.var == null ? '—' : `<span class="${r._o.var > 0 ? 'neg' : r._o.var < 0 ? 'pos' : ''}">${U.money(r._o.var, { sign: 1 })}</span>`, s: r => r._o.var, sum: r => r._o.var },
      { k: 'varp', l: 'Var. %', n: true, f: r => U.pct(r._o.varPct), s: r => r._o.varPct },
      { k: 'atraso', l: 'Dias atraso', n: true, f: r => r._o.atraso == null ? '—' : r._o.atraso, s: r => r._o.atraso },
      { k: 'juros', l: 'Juros', n: true, f: r => r.juros ? U.money(r.juros) : '', s: r => r.juros, sum: r => r.juros },
      { k: 'multa', l: 'Multa', n: true, f: r => r.multa ? U.money(r.multa) : '', s: r => r.multa, sum: r => r.multa },
      { k: 'desconto', l: 'Desconto', n: true, f: r => r.desconto ? U.money(r.desconto) : '', s: r => r.desconto, sum: r => r.desconto },
      { k: 'taxas', l: 'Taxas', n: true, f: r => r.taxas ? U.money(r.taxas) : '', s: r => r.taxas, sum: r => r.taxas },
      { k: 'status', l: 'Status', f: r => `<span class="st ${/não just|Pendente/.test(r._o.status) ? 'bad' : /Conferido|explicada/.test(r._o.status) ? 'ok' : 'open'}">${r._o.status}</span>`, s: r => r._o.status },
      { k: 'just', l: 'Justificativa / pendência', s: r => (S.settings.manual[r.key] || {}).nota || r._o.just, cls: 'wrap small' },
    ]
  });
};

/* ---------- despesas ---------- */
VIEWS.despesas = function (main) {
  const R = recs().filter(r => r.k === 'despesa' && r.st !== 'cancelado');
  const real = R.filter(r => r.st === 'realizado');
  const open = R.filter(r => r.open);
  const cols = COLS.pagar();
  const val = r => r.st === 'realizado' ? r.valor : 0; // parcial: o valor pago está na própria linha realizada
  const curM = U.month(S.ui.base);
  const monthAdd = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  // evolução mensal: realizado (data efetiva) x previsto (valor original pela data de vencimento)
  const months = [...new Set(R.flatMap(r => [U.month(r.effDate), U.month(r.dtVenc || r.dueDate)]).filter(Boolean))].sort();
  const evo = months.map(m => {
    const rl = R.filter(r => (r.st === 'realizado' || r.st === 'parcial') && U.month(r.effDate) === m);
    const pv = R.filter(r => U.month(r.dtVenc || r.dueDate) === m);
    const op = open.filter(r => U.month(r.dueDate) === m);
    return { k: m, real: U.sum(rl, val), prev: U.sum(pv, r => r.orig), open: U.sum(op, r => r.openAmt), _drill: drillId('Despesas de ' + U.monthLabel(m), pv.concat(rl.filter(r => !pv.includes(r))), cols) };
  });
  // categorias que mais pressionam o caixa (próximos 30 dias) e aumentos relevantes
  const d30 = U.addDays(S.ui.base, 30);
  const next30 = open.filter(r => r.dueDate && r.dueDate <= d30);
  const hist = real.filter(r => U.month(r.effDate) < curM);
  const histMonths = new Set(hist.map(r => U.month(r.effDate))).size || 1;
  const catNow = U.groupBy(R.filter(r => U.month(r.dueDate || r.effDate) === curM), r => r.categoria || '(sem categoria)');
  const catHist = U.groupBy(hist, r => r.categoria || '(sem categoria)');
  const incr = [...catNow.entries()].map(([k, l]) => { const now = U.sum(l, r => r.open ? r.openAmt : r.valor); const avg = U.r2(U.sum(catHist.get(k) || [], val) / histMonths); return { k, now, avg, d: U.r2(now - avg), p: avg ? (now - avg) / avg : null, l }; }).filter(x => x.avg > 0 && x.d > 0 && x.p > 0.25).sort((a, b) => b.d - a.d);
  // extraordinárias: valor > 2x a mediana da categoria (mín. 3 lançamentos) ou categoria com um único lançamento acima de R$ 2.000
  const byCat = U.groupBy(R, r => r.categoria);
  const extra = []; for (const [, l] of byCat) { const vals = l.map(r => r.orig || 0); const md = U.median(vals); for (const r of l) if ((l.length >= 3 && r.orig > 2 * md && r.orig > 500) || (l.length === 1 && r.orig >= 2000)) extra.push(r); }
  const semClass = R.filter(r => !r.aIdent && (!r.categoria || !r.centroCusto));
  const aIdent = R.filter(r => r.aIdent);
  const rec = recurring(R);
  let html = head('Análise de despesas e custos', scopeNote() + ' · realizado = pela data efetiva; previsto = valor original pela data de vencimento');
  html += `<div class="kpis">${kpi('Despesas realizadas (base)', U.sum(real, val), 'todas as datas do relatório', real, { cols })}${kpi('Despesas em aberto', U.sum(open, r => r.openAmt), 'todas as datas', open, { cols })}${kpi('A pagar nos próximos 30 dias', U.sum(next30, r => r.openAmt), U.brShort(S.ui.base) + ' a ' + U.brShort(d30) + ' (inclui vencidos)', next30, { cols })}${kpi('Aguardando identificação dos sócios', U.sum(aIdent, r => r.open ? r.openAmt : r.valor), aIdent.length + ' lanç. · categoria a identificar ou VERIFICAR', aIdent, { cols })}${kpi('Sem classificação', semClass.length, 'sem categoria ou sem centro de custo (fora os a identificar)', semClass, { cls: semClass.length ? 'warn' : '', cols })}</div>`;
  const evoExp = !!S.ui.despesasEvoExpandido;
  const evoWin = [-3, -2, -1, 1, 2, 3].map(n => monthAdd(curM, n)).map(k => evo.find(e => e.k === k) || { k, real: 0, prev: 0, open: 0 });
  const evoShow = evoExp ? evo : evoWin;
  const evoMais = evo.some(e => !evoWin.some(w => w.k === e.k));
  html += `<div class="card"><h3>Evolução mensal: previsto x realizado</h3>${flowChart([{ name: 'Previsto (valor original)', points: evoShow.map(e => ({ l: U.monthLabel(e.k), v: e.prev })) }, { name: 'Realizado', points: evoShow.map(e => ({ l: U.monthLabel(e.k), v: e.real })) }], { h: 220 })}
    ${stable([{ l: 'Mês', f: r => U.monthLabel(r.k) }, { l: 'Previsto', n: true, f: r => U.money(r.prev) }, { l: 'Realizado', n: true, f: r => U.money(r.real) }, { l: 'Em aberto', n: true, f: r => U.money(r.open) }, { l: 'Realizado − previsto', n: true, f: r => U.money(r.real - r.prev, { sign: 1 }) }], evoShow, { cls: 'click' })}
    <p class="small">Mostra 3 meses antes e 3 meses depois do mês base (${U.monthLabel(curM)}, em andamento, fica de fora para não distorcer a comparação).${evoMais ? ` <button class="btn sm" id="evo-toggle">${evoExp ? 'Ver só em torno do mês base' : `Ver todos os ${evo.length} meses`}</button>` : ''}</p></div>`;
  html += `<div class="card"><h3>Categorias que mais pressionam o caixa (próximos 30 dias)</h3>${next30.length ? groupChart(next30, r => r.categoria, 'Categoria', r => r.openAmt, { limit: 10 }) : '<p class="small muted-t">Nenhuma despesa em aberto nos próximos 30 dias.</p>'}</div>`;
  html += `<div class="card"><h3>Aumentos relevantes no mês atual (${U.monthLabel(curM)}) frente à média realizada dos meses anteriores</h3>${incr.length ? stable([{ l: 'Categoria', k: 'k' }, { l: 'Mês atual', n: true, f: r => U.money(r.now) }, { l: 'Média histórica', n: true, f: r => U.money(r.avg) }, { l: 'Aumento', n: true, f: r => `<span class="neg">${U.money(r.d)} (${U.pct(r.p)})</span>` }], incr.map(x => ({ ...x, _drill: drillId(x.k, x.l, cols) })), { cls: 'click' }) : '<p class="small">Nenhum aumento acima de 25% ou sem histórico suficiente nos primeiros meses do Conta Azul.</p>'}</div>`;
  html += `<div class="card"><h3>Realizado por categoria</h3>${real.length ? groupChart(real, r => r.categoria, 'Categoria', val, { limit: 12 }) : '<p class="small muted-t">Nenhuma despesa realizada no período.</p>'}</div>`;
  const tabs = [['pessoa', 'Fornecedor', r => r.pessoa], ['centro', 'Centro de custo', r => r.centroCusto]];
  html += `<div class="grid2">${tabs.map(([k, l, fn]) => `<div class="card"><h3>Realizado por ${l.toLowerCase()}</h3>${groupTable(real, fn, l, val, { cols, limit: 15 })}</div>`).join('')}</div>`;
  html += `<div class="grid2"><div class="card"><h3>Despesas recorrentes (mesmo fornecedor e categoria em 3+ meses)</h3>${stable([{ l: 'Fornecedor', f: x => U.esc(x[0].pessoa) }, { l: 'Categoria', f: x => U.esc(x[0].categoria) }, { l: 'Meses', n: true, f: x => new Set(x.map(r => U.month(r.dueDate || r.effDate))).size }, { l: 'Valor médio', n: true, f: x => U.money(U.sum(x, r => r.orig) / x.length) }], rec.map(l => Object.assign(l, { _drill: drillId(l[0].pessoa + ' · ' + l[0].categoria, l, cols) })), { cls: 'click' })}</div>
    <div class="card"><h3>Despesas extraordinárias (possíveis)</h3><p class="small">Valor acima de 2x a mediana da categoria, ou lançamento único na categoria acima de R$ 2.000.</p><div id="tex"></div></div></div>`;
  html += `<p class="small">Resultado por centro de custo: esta tela mostra entradas e saídas de caixa por centro de custo. Não é lucro ou prejuízo do centro de custo: faltam custos sem centro de custo, compromissos ainda não lançados e a competência.</p>`;
  main.innerHTML = html;
  mountTable($('#tex'), { id: 'extra', rows: extra, cols, pageSize: 20 });
  const evoToggle = $('#evo-toggle'); if (evoToggle) evoToggle.onclick = () => { S.ui.despesasEvoExpandido = !evoExp; render(); };
};

/* ---------- folha e pessoal ---------- */
VIEWS.folha = function (main) {
  const R = recs().filter(r => r.k === 'despesa' && r.st !== 'cancelado');
  const F = R.filter(r => r.folha && r.folha !== 'Não é folha');
  const srcTag = r => `<span class="st ${r.folhaSrc === 'confirmado' ? 'ok' : r.folhaSrc === 'automático' ? 'open' : 'warn'}">${r.folhaSrc}</span>`;
  const cols = COLS.pagar().concat([{ k: 'folha', l: 'Classe (folha)', f: r => `${U.esc(r.folha)} ${srcTag(r)}`, s: r => r.folha + ' ' + r.folhaSrc }]);
  // cada lançamento entra uma vez: quitado pelo valor pago; em aberto ou parcial pelo saldo em aberto (a parte já paga de um parcial está em outra linha, quitada)
  const val = r => r.open ? r.openAmt : r.valor;
  const months = [...new Set(F.map(r => U.month(r.dueDate || r.effDate)).filter(Boolean))].sort();
  const classes = [...new Set(F.map(r => r.folha))].sort();
  const mat = classes.map(c => { const o = { k: c }; months.forEach(m => { const l = F.filter(r => r.folha === c && U.month(r.open ? r.dueDate : (r.effDate || r.dueDate)) === m); o[m] = U.sum(l, val); o['_l' + m] = l; }); return o; });
  const next30 = F.filter(r => r.open && r.dueDate && r.dueDate <= U.addDays(S.ui.base, 30));
  const by = s => F.filter(r => r.folhaSrc === s);
  let html = head('Folha de pagamento e obrigações de pessoal', scopeNote());
  html += `<div class="banner small">Três níveis de classificação: <b>confirmado</b> (escolhido pela CM no lançamento), <b>automático</b> (a regra casou na categoria do Conta Azul) e <b>sugestão</b> (a regra casou só na descrição; precisa de confirmação). Uma sugestão nunca vira confirmada sozinha: clique na linha e escolha a classe.</div>`;
  html += `<div class="kpis">${kpi('Pessoal a pagar em 30 dias', U.sum(next30, r => r.openAmt), U.brShort(S.ui.base) + ' a ' + U.brShort(U.addDays(S.ui.base, 30)), next30, { cols })}
    ${kpi('Confirmados', by('confirmado').length, 'classificados pela CM', by('confirmado'), { cls: 'ok', cols })}
    ${kpi('Automáticos', by('automático').length, 'regra pela categoria do Conta Azul', by('automático'), { cols })}
    ${kpi('Sugestões a confirmar', by('sugestão').length, 'regra só pela descrição', by('sugestão'), { cls: by('sugestão').length ? 'warn' : '', cols })}</div>`;
  html += `<div class="card"><h3>Por classe e mês (pago pelo valor pago, em aberto pelo saldo)</h3>${stable([{ l: 'Classe', k: 'k' }].concat(months.map(m => ({ l: U.monthLabel(m), n: true, f: r => r[m] ? `<a data-drill="${drillId(r.k + ' ' + U.monthLabel(m), r['_l' + m], cols)}">${U.money(r[m])}</a>` : '—' }))), mat, { foot: ['Total'].concat(months.map(m => U.money(U.sum(mat, r => r[m])))) })}</div>`;

/* ---------- cenários ---------- */
VIEWS.cenarios = function (main) {
  const scs = S.settings.scenarios; const names = ['conservador', 'base', 'otimista'];
  names.forEach(n => scs[n] = Object.assign(emptyScenario(), scs[n] || {}));
  const P = names.map(n => projFor(S.ui.cnpj, n));
  const days = 90; const base = S.ui.base;
  let html = head('Cenários', scopeNote() + ' · as simulações não alteram os dados do Conta Azul');
  html += `<div class="banner small">Nenhum percentual vem preenchido: atraso, perda de receita e variação de custos só devem ser usados com histórico ou confirmação da CM, registrada no campo "Justificativa". Valores ajustados ficam marcados como <b>estimado</b>.</div>`;
  const f = (n, k, l) => `<label>${l}<input type="number" step="any" data-sc="${n}" data-k="${k}" value="${scs[n][k] || ''}" placeholder="0"></label>`;
  const res = (p) => {
    const d30 = p.days.slice(0, 31); const maxD = d30.reduce((a, d) => d.sai > a.sai ? d : a, { sai: 0 });
    const wk = aggregate(p.days.slice(0, 91), 'semana').reduce((a, w) => w.sai > a.sai ? w : a, { sai: 0 });
    const min90 = p.days.slice(0, days).reduce((a, d) => d.fim < a.v ? { v: d.fim, d: d.d } : a, { v: Infinity });
    return `<div class="scr"><div>Saldo em ${U.br(U.endOfMonth(base))}: <b>${U.money((p.days.find(d => d.d === U.endOfMonth(base)) || {}).fim)}</b></div>
      <div>Menor saldo (90 dias): <b class="${min90.v < (S.settings.riskMin || 0) ? 'neg' : ''}">${U.money(min90.v)}</b> em ${U.br(min90.d)}</div>
      <div>Primeiro risco: <b>${p.firstNeg ? U.br(p.firstNeg.d) : 'nenhum'}</b></div>
      <div>Capital de giro necessário: <b class="${p.needGiro ? 'neg' : ''}">${p.needGiro ? U.money(p.needGiro.v) + ' em ' + U.br(p.needGiro.d) : 'nenhum'}</b></div>
      <div>Maior saída num dia (30 dias): <b>${maxD.d ? U.money(maxD.sai) + ' em ' + U.br(maxD.d) : '—'}</b></div>
      <div>Semana mais pesada (13 semanas): <b>${wk.from ? U.money(wk.sai) + ' (' + U.brShort(wk.from) + ' a ' + U.brShort(wk.to) + ')' : '—'}</b></div></div>`;
  };
  html += `<div class="grid3">${names.map((n, i) => { const s = scs[n]; return `<div class="card sc"><h3>${n[0].toUpperCase() + n.slice(1)} <a class="small" onclick="S.ui.scenario='${n}';go('fluxo')">ver no fluxo</a></h3>
    ${f(n, 'atrasoRec', 'Atraso nos recebimentos (dias)')}${f(n, 'antecipaRec', 'Antecipação de recebimentos (dias)')}${f(n, 'perdaRec', 'Recebimentos não realizados (%)')}
    ${f(n, 'aumentoCustos', 'Variação das despesas (%, negativo = economia)')}${f(n, 'adiarPag', 'Adiar pagamentos (dias)')}
    <label class="col">Justificativa / fonte das premissas<textarea rows="2" data-sc="${n}" data-k="premissa">${U.esc(s.premissa || '')}</textarea></label>
    <h4>Novos compromissos e entradas</h4>${(s.extras || []).map((x, j) => `<div class="small">${U.br(x.data)} · ${U.esc(x.desc || '')} · <b class="${x.valor < 0 ? 'neg' : 'pos'}">${U.money(+x.valor)}</b> ${x.cnpj ? cnpjTag(x.cnpj) : '<span class="small muted-t">consolidado</span>'} <a data-scdel="${n}|extras|${j}">remover</a></div>`).join('') || '<p class="small muted-t">nenhum</p>'}
    <div class="form-row tight"><input data-nx="${n}" data-f="desc" placeholder="Descrição"><select data-nx="${n}" data-f="tipo"><option value="-1">Saída</option><option value="1">Entrada</option></select><input data-nx="${n}" data-f="valor" placeholder="Valor" inputmode="decimal" size="8"><input type="date" data-nx="${n}" data-f="data"><select data-nx="${n}" data-f="cnpj"><option value="">Sem CNPJ</option><option>52</option><option>20</option></select><button class="btn sm" data-addx="${n}">Incluir</button></div>
    <h4>Datas alteradas na simulação</h4>${(s.shifts || []).map((x, j) => `<div class="small">${U.esc(x.desc || x.key)} → <b>${U.br(x.data)}</b> <a data-scdel="${n}|shifts|${j}">remover</a></div>`).join('') || '<p class="small muted-t">nenhuma. Para mover um pagamento ou recebimento, abra o lançamento e use "Simular nova data".</p>'}
    ${res(P[i])}</div>`; }).join('')}</div>`;
  html += `<div class="card"><h3>Saldo diário: próximos ${days} dias</h3>${flowChart(names.map((n, i) => ({ name: n, points: P[i].days.slice(0, days).map(d => ({ l: U.brShort(d.d), v: d.fim })) })), { riskMin: S.settings.riskMin, h: 300 })}</div>`;
  const mons = aggregate(P[1].days.slice(0, 366), 'mes').slice(0, 12).map(x => x.k);
  html += `<div class="card"><h3>Saldo no fim de cada mês</h3>${stable([{ l: 'Mês', f: r => U.monthLabel(r.k) }].concat(names.map((n, i) => ({ l: n, n: true, f: r => `<span class="${r[n] < 0 ? 'neg' : ''}">${U.money(r[n])}</span>` }))), mons.map(m => { const o = { k: m }; names.forEach((n, i) => { const g = aggregate(P[i].days.slice(0, 366), 'mes').find(x => x.k === m); o[n] = g ? g.fim : null; }); return o; }))}</div>`;
  html += `<div class="card"><h3>Premissas de cada cenário</h3>${names.map(n => `<p class="small"><b>${n}:</b> ${scenarioText(scs[n])}</p>`).join('')}<p class="small">Atraso desloca a data prevista dos recebimentos em aberto; "não realizados" reduz o valor de todos os recebimentos em aberto; variação de despesas aplica-se a todos os pagamentos em aberto; adiar desloca todos os pagamentos em aberto. Uma data alterada num lançamento específico substitui o atraso/adiamento geral para ele. Compromissos sem CNPJ entram só no consolidado. Capital de giro = quanto faltaria no pior dia do horizonte para manter o saldo mínimo de segurança (Configurações).</p></div>`;
  main.innerHTML = html;
  $$('[data-sc]').forEach(inp => inp.onchange = async () => { const k = inp.dataset.k; S.settings.scenarios[inp.dataset.sc][k] = k === 'premissa' ? inp.value : (inp.value === '' ? 0 : +inp.value); await saveSettings(); render(); });
  $$('[data-addx]').forEach(b => b.onclick = async () => {
    const n = b.dataset.addx; const g = f => ($(`[data-nx="${n}"][data-f="${f}"]`) || {}).value;
    const v = P_num(g('valor')); if (!v || !g('data')) { toast('Informe valor e data', true); return; }
    S.settings.scenarios[n].extras.push({ desc: g('desc') || '', valor: U.r2(Math.abs(v) * +g('tipo')), data: g('data'), cnpj: g('cnpj') || '' });
    await saveSettings(); render();
  });
  $$('[data-scdel]').forEach(a => a.onclick = async () => { const [n, k, j] = a.dataset.scdel.split('|'); S.settings.scenarios[n][k].splice(+j, 1); await saveSettings(); render(); });

function P_num(v) { return P.number(v); }

/* ---------- comparativo e revisão ---------- */
VIEWS.comparativo = function (main) {
  const cur = activeVersion();
  const others = S.versions.filter(v => v.id !== cur.id);
  let html = head('Comparativo e revisão da importação', scopeNote());
  if (!others.length) { main.innerHTML = html + `<div class="card"><p>Só existe uma versão importada. Na próxima semana, importe o novo relatório: esta tela vai comparar as duas versões.</p></div>`; return; }
  const prevId = S.ui.cmpPrev && others.find(v => v.id === S.ui.cmpPrev) ? S.ui.cmpPrev : (prevVersion(cur) || others[others.length - 1]).id;
  const pv = S.versions.find(v => v.id === prevId);
  html = head('Comparativo e revisão da importação', scopeNote(), `Comparar <b>${U.esc(cur.label)}</b> com <select onchange="S.ui.cmpPrev=this.value;render()">${others.map(v => `<option value="${v.id}" ${v.id === prevId ? 'selected' : ''}>${U.esc(v.label)} (${U.dt(v.at)})</option>`).join('')}</select>`);
  const c = S.ui.cnpj;
  const f = l => c === 'C' ? l : l.filter(x => (x.cur || x.prev || x).cnpj === c || (Array.isArray(x) && x[0].cnpj === c));
  const res = compareVersions(pv.records, cur.records, S.settings, S.ui.base);
  const R = {}; for (const k in res) R[k] = f(res[k]);
  const rvKey = cur.id + '|' + pv.id; const RV = S.settings.reviews[rvKey] = S.settings.reviews[rvKey] || {};
  const pair = (l, sec) => l.map(x => Object.assign({}, x.cur, { _prev: x.prev, _how: x.how, _imp: changeImpact(sec, x.prev, x.cur), _pend: x.pend }));
  const single = (l, sec, side) => l.map(r => Object.assign({}, r, { _imp: side === 'prev' ? changeImpact(sec, r, null) : changeImpact(sec, null, r) }));
  const rvCol = sec => ({ k: 'rv', l: 'Revisado', f: r => `<input type="checkbox" class="rv" data-rv="${rvKey}" data-k="${sec}|${U.esc(r.key)}" ${RV[sec + '|' + r.key] ? 'checked' : ''}>`, s: r => RV[sec + '|' + r.key] ? 1 : 0 });
  const impCol = { k: 'imp', l: 'Efeito no caixa', f: r => `<span class="small ${r._imp && (r._imp.dp < 0 || r._imp.dr < 0) ? 'neg' : ''}">${U.esc(r._imp ? r._imp.txt : '')}</span>`, s: r => r._imp ? r._imp.dp + r._imp.dr : 0, sum: r => r._imp ? U.r2(r._imp.dp + r._imp.dr) : 0, cls: 'wrap' };
  const pairCols = [
    { k: 'pessoa', l: 'Cliente / fornecedor', s: r => r.pessoa }, { k: 'descricao', l: 'Descrição', s: r => r.descricao, cls: 'wrap' },
    { k: 'antes', l: 'Antes', f: r => `${U.esc(r._prev.situacao)} · ${U.money(r._prev.open ? r._prev.openAmt : r._prev.valor)} · prev. ${U.br(r._prev.dtPrev)} · venc. ${U.br(r._prev.dtVenc)}`, s: r => r._prev.situacao, cls: 'small' },
    { k: 'agora', l: 'Agora', f: r => `${U.esc(r.situacao)} · ${U.money(r.open ? r.openAmt : r.valor)} · prev. ${U.br(r.dtPrev)} · venc. ${U.br(r.dtVenc)}`, s: r => r.situacao, cls: 'small' },
    impCol,
    { k: 'how', l: 'Correspondência', f: r => r._how === 'id' ? '<span class="st ok">mesmo lançamento</span>' : '<span class="st warn">sugerida: validar</span>', s: r => r._how },
  ];
  const contaCols = [pairCols[0], pairCols[1], pairCols[2],
    { k: 'ca', l: 'Conta antes', f: r => U.esc(r._prev.conta || 'sem conta'), s: r => r._prev.conta },
    { k: 'cn', l: 'Conta agora', f: r => U.esc(r.conta || 'sem conta'), s: r => r.conta },
    { k: 'vl', l: 'Valor', n: true, f: r => U.money(r.open ? r.openAmt : r.valor), s: r => r.valor }, impCol, pairCols[pairCols.length - 1]];
  const pendCols = [pairCols[0], pairCols[1], pairCols[2], { k: 'pd', l: 'Pendência', s: r => (r._pend || []).join('; '), cls: 'wrap small' }, { k: 'vl', l: 'Valor', n: true, f: r => U.money(r.open ? r.openAmt : r.valor), s: r => r.valor }];
  const baseImp = COLS.base().concat([impCol]);
  const secs = [
    ['novos', 'Novos lançamentos', single(R.novos, 'novos'), baseImp, r => r.sign * (r.open ? r.openAmt : r.valor)],
    ['quitados', 'Passaram de abertos para quitados', pair(R.quitados, 'quitados'), pairCols],
    ['recebidos', 'Recebimentos realizados', pair(R.recebidos, 'recebidos'), pairCols, r => r.valor],
    ['pagos', 'Pagamentos realizados', pair(R.pagos, 'pagos'), pairCols, r => r.valor],
    ['parciais', 'Liquidados parcialmente', pair(R.parciais, 'parciais'), pairCols, r => r.openAmt],
    ['valor', 'Alterações de valor', pair(R.valor, 'valor'), pairCols],
    ['data', 'Alterações de vencimento ou data prevista', pair(R.data, 'data'), pairCols],
    ['conta', 'Mudança de conta bancária', pair(R.conta, 'conta'), contaCols],
    ['sumiram', 'Desapareceram do relatório', single(R.sumiram, 'sumiram', 'prev'), baseImp, r => r.sign * (r.open ? r.openAmt : r.valor)],
    ['incertos', 'Correspondências incertas (validar)', pair(R.incertos, 'incertos'), pairCols],
    ['dup', 'Possíveis duplicidades', R.dup.flat(), COLS.base()],
    ['pendNovas', 'Pendências que surgiram', pair(R.pendNovas, 'pendNovas'), pendCols],
    ['pendResolvidas', 'Pendências resolvidas', pair(R.pendResolvidas, 'pendResolvidas'), pendCols],
    ['status', 'Outras mudanças de situação', pair(R.outrosStatus, 'status'), pairCols],
    ['venc', 'Vencidos e ainda em aberto', R.venceramAbertos, COLS.base(), r => r.sign * r.openAmt],
  ];
  const reviewable = secs.filter(s => !['venc', 'pendResolvidas'].includes(s[0]));
  const totRv = reviewable.reduce((a, s) => a + s[2].length, 0), doneRv = reviewable.reduce((a, s) => a + s[2].filter(r => RV[s[0] + '|' + r.key]).length, 0);
  const sel = S.ui.cmpSec || 'novos';
  html += `<div class="banner ${doneRv < totRv ? 'warn' : 'ok'}">Revisão: <b>${doneRv} de ${totRv}</b> alteração(ões) marcadas como revisadas. Marque cada linha depois de conferir no Conta Azul; a marcação fica salva e vai no backup. ${RV._concluida ? 'Revisão concluída em ' + U.dt(RV._concluida.at) + (RV._concluida.pend ? ' com ' + RV._concluida.pend + ' item(ns) não revisados' : '') + '.' : `<button class="btn sm" id="rv-close">Concluir revisão${doneRv < totRv ? ' com pendências' : ''}</button>`}</div>`;
  html += `<div class="kpis">${secs.map(([k, l, L, , vf]) => { const nd = L.filter(r => RV[k + '|' + r.key]).length; return `<div class="kpi click ${sel === k ? 'sel' : ''} ${k === 'sumiram' && L.length ? 'warn' : ''}" onclick="S.ui.cmpSec='${k}';render()"><div class="kl">${l}</div><div class="kv">${L.length}</div><div class="kp">${vf ? U.money(U.sum(L, vf)) : '&nbsp;'}${L.length && k !== 'venc' && k !== 'pendResolvidas' ? ' · ' + nd + ' revisado(s)' : ''}</div></div>`; }).join('')}</div>`;
  if (sel === 'sumiram') html += `<div class="banner warn">Um lançamento que sumiu do relatório <b>não</b> é tratado como pago nem como cancelado. Confira no Conta Azul se foi excluído, cancelado, renegociado ou se o filtro da exportação mudou.</div>`;
  if (sel === 'incertos') html += `<div class="banner">O relatório não traz identificador do lançamento; estas correspondências foram sugeridas pela combinação tipo + pessoa + conta + descrição/valor/data. Confira antes de considerar a alteração.</div>`;
  const cur0 = secs.find(s => s[0] === sel);
  const showRv = !['venc', 'pendResolvidas'].includes(sel);
  html += `<div class="card"><div class="ch"><h3>${cur0[1]}</h3>${showRv && cur0[2].length ? `<button class="btn sm" id="rv-all">Marcar todos desta seção como revisados</button>` : ''}</div><div id="tbl"></div></div>`;
  // saldos por conta: antes x agora (mesma data-base e mesma configuração)
  const prevAll = enrich(pv.records, S.settings, S.ui.base);
  const bp = accountBalances(prevAll, S.settings, S.ui.base), bc = data().balances;
  const contas = [...new Set(bp.map(b => b.conta).concat(bc.map(b => b.conta)))].filter(k => c === 'C' || [...bp, ...bc].find(b => b.conta === k).cnpj === c).sort();
  html += `<div class="grid2"><div class="card"><h3>Saldos por conta (mesma data-base ${U.br(S.ui.base)})</h3>${stable([{ l: 'Conta', f: r => U.esc(r.k) }, { l: 'Antes', n: true, f: r => U.money(r.a) }, { l: 'Agora', n: true, f: r => U.money(r.b) }, { l: 'Variação', n: true, f: r => { const d = U.r2((r.b || 0) - (r.a || 0)); return d ? `<span class="${d < 0 ? 'neg' : 'pos'}">${U.money(d, { sign: 1 })}</span>` : '—'; } }], contas.map(k => ({ k, a: (bp.find(b => b.conta === k) || {}).calc, b: (bc.find(b => b.conta === k) || {}).calc })))}<p class="small">Saldo calculado = saldo inicial + realizados até a data-base, em cada versão. Variação sem novo extrato = lançamento quitado, excluído ou trocado de conta.</p></div>
    <div class="card"><h3>Variação no saldo projetado e nas datas de risco</h3>${riskChangeHtml(pv)}</div></div>`;
  main.innerHTML = html;
  mountTable($('#tbl'), { id: 'cmp' + sel, rows: cur0[2], cols: showRv ? cur0[3].concat([rvCol(sel)]) : cur0[3], name: 'comparativo_' + sel });
  const all = $('#rv-all'); if (all) all.onclick = async () => { const t = Date.now(); cur0[2].forEach(r => RV[sel + '|' + r.key] = t); await saveSettings(); render(); };
  const cl = $('#rv-close'); if (cl) cl.onclick = async () => { const nota = doneRv < totRv ? prompt('Há ' + (totRv - doneRv) + ' alteração(ões) não revisadas. Registre o motivo ou o responsável (fica no histórico):', '') : ''; if (nota === null) return; RV._concluida = { at: Date.now(), pend: totRv - doneRv, nota }; await saveSettings(); render(); toast('Revisão concluída'); };
};

/* ---------- alertas ---------- */
function computeAlerts() {
  const D = data(); if (!D) return [];
  const c = S.ui.cnpj; const R = recs(); const base = S.ui.base; const out = [];
  const add = (sev, title, txt, list, cols) => out.push({ sev, title, txt, list, cols });
  const pj = projFor(c);
  if (pj.firstNeg) {
    const pays = movesToRows(pj.moves.filter(m => m.date && m.date <= pj.firstNeg.d && m.amt < 0));
    add('bad', 'Saldo projetado negativo', `Em ${U.br(pj.firstNeg.d)} o saldo projetado fica em ${U.money(pj.firstNeg.fim)} (falta ${U.money(pj.firstNeg.gap)}).`, pays, COLS.move());
  }
  // pagamentos importantes sem cobertura: maior pagamento dos próximos 30 dias acima do saldo disponível no dia anterior
  const big = pj.days.slice(0, 31).flatMap(d => d.moves.filter(m => m.amt < 0 && -m.amt > Math.max(0, d.ini)).map(m => ({ m, d })));
  if (big.length) add('bad', 'Pagamentos sem cobertura de saldo', `${big.length} pagamento(s) nos próximos 30 dias maiores que o saldo projetado do dia.`, movesToRows(big.map(x => x.m)), COLS.move());
  // concentração de saídas
  const out30 = pj.days.slice(0, 31); const totOut = U.sum(out30, d => d.sai);
  const top = [...out30].sort((a, b) => b.sai - a.sai).slice(0, 3); const topSum = U.sum(top, d => d.sai);
  if (totOut > 0 && topSum / totOut > 0.6 && top.length) add('warn', 'Concentração de saídas', `${U.pct(topSum / totOut)} das saídas dos próximos 30 dias estão em 3 dias: ${top.map(d => U.br(d.d) + ' (' + U.money(d.sai) + ')').join(', ')}.`, movesToRows(top.flatMap(d => d.moves.filter(m => m.amt < 0))), COLS.move());
  const arV = R.filter(r => r.overdue && r.k === 'receita'); if (arV.length) add('warn', 'Recebíveis vencidos', `${arV.length} recebível(is) vencido(s): ${U.money(U.sum(arV, r => r.openAmt))}.`, arV, COLS.receber());
  const apV = R.filter(r => r.overdue && r.k === 'despesa'); if (apV.length) add('bad', 'Obrigações vencidas', `${apV.length} obrigação(ões) vencida(s) em aberto: ${U.money(U.sum(apV, r => r.openAmt))}.`, apV, COLS.pagar());
  const conc = R.map(reconcile).filter(o => o && o.status === 'Diferença não justificada'); if (conc.length) add('warn', 'Diferenças entre previsto e pago', `${conc.length} lançamento(s) com diferença não justificada: ${U.money(U.sum(conc, o => o.var))}.`, conc.map(o => o.r), COLS.pagar());
  const noD = R.filter(r => r.open && !r.dueDate); if (noD.length) add('warn', 'Registros sem data', `${noD.length} lançamento(s) em aberto sem data prevista nem vencimento: ficam fora da projeção.`, noD, COLS.base());
  for (const b of D.balances) {
    if (b.cash && b.diffOpening) add('bad', 'Saldo do banco x relatório · ' + b.conta, `Pelo saldo do banco (${U.money(b.opening.valor)} em ${U.br(b.opening.data)}) a conta teria ${U.money(b.calcFromOpening)}; pelo relatório, ${U.money(b.calc)}. Diferença ${U.money(b.diffOpening)}: movimento não lançado, lançado em outra conta ou saldo inicial errado. Nada foi corrigido automaticamente.`, b.records, COLS.base());
    if ((b.type === 'banco' || b.type === 'cartao') && b.stale) add(b.conciliadoAte ? 'warn' : 'info', 'Conciliação desatualizada · ' + b.conta, b.conciliadoAte ? `Conciliada até ${U.br(b.conciliadoAte)} (${b.concDias} dias antes da data-base). Saldos e projeção podem estar incompletos.` : `Data de conciliação não informada em Configurações${b.lastMov ? '; último movimento realizado em ' + U.br(b.lastMov) : ''}.`, null);
    if (b.cash && b.saldoInicial == null && !b.opening) add('warn', 'Conta sem saldo inicial · ' + b.conta, 'O relatório não tem a linha de saldo inicial desta conta e não há saldo do banco informado: o saldo calculado parte de zero.', null);
  }
  const fr = R.filter(r => r.futReal); if (fr.length) add('warn', 'Movimentos futuros marcados como quitados', `${fr.length} lançamento(s) quitado(s) com data depois de ${U.br(base)}: ficaram fora do saldo realizado e entram na projeção como pendentes.`, fr, COLS.base());
  const bd = R.filter(r => r.badDates && r.badDates.length); if (bd.length) add('warn', 'Datas inválidas no arquivo', `${bd.length} lançamento(s) com data ilegível. O valor original foi mantido no registro.`, bd, COLS.base());
  const si = R.filter(r => r.st === 'indefinido'); if (si.length) add('bad', 'Situação não reconhecida', `${si.length} lançamento(s) com situação desconhecida: não entram no saldo nem na projeção até ajustar em Configurações.`, si, COLS.base());
  const sc = R.filter(r => !r.conta && r.k !== 'saldo'); if (sc.length) add('warn', 'Movimentações sem conta bancária', `${sc.length} lançamento(s) sem conta: ${U.money(U.sum(sc, r => r.sign * (r.open ? r.openAmt : r.valor)))}.`, sc, COLS.base());
  for (const cc of cardCheck(R).filter(x => x.diff != null && Math.abs(x.diff) >= 0.01)) add('warn', 'Fatura x compras do cartão · ' + cc.conta, `Fatura agendada para ${U.br(cc.venc)}: ${U.money(cc.fatura)}; compras em aberto no mesmo vencimento: ${U.money(cc.compras)} (diferença ${U.money(cc.diff, { sign: 1 })}). A projeção usa as compras e só soma o excedente da fatura.`, cc.recs, COLS.base());
  const orf = orphanManual(S.settings, D.all); if (orf.length) add('warn', 'Ajustes manuais sem lançamento', `${orf.length} ajuste(s) manual(is) não encontraram o lançamento na versão atual (a chave mudou ou o lançamento sumiu). Nada foi apagado: reassocie em Pendências.`, null);
  const ex = projFor(c).excluded; if (ex.length) add('info', 'Lançamentos fora da projeção', `${ex.length} lançamento(s) não entram no fluxo (aplicação/capital ou pagamento de fatura já coberto pelas compras do cartão).`, ex.map(x => x.r), COLS.base());
  if (D.saldoCheck && D.saldoCheck.bad.length) add('warn', 'Coluna "Saldo conta" diverge do recálculo', `${D.saldoCheck.bad.length} linha(s) em que o saldo acumulado do relatório não bate com a soma dos valores.`, D.saldoCheck.bad.map(x => x.r), COLS.base());
  const iss = findIssues(R).filter(i => /duplicidade|Conta provavelmente|Caixa F/.test(i.tipo));
  const g = U.groupBy(iss, i => i.tipo);
  for (const [t, l] of g) add('warn', t, `${l.length} ocorrência(s). Ver em Pendências.`, l.flatMap(i => i.recs), COLS.base());
  // aumento de despesas no mês
  const curM = U.month(base); const prevM = U.month(U.addDays(curM + '-01', -1));
  const dm = m => U.sum(R.filter(r => r.k === 'despesa' && r.st !== 'cancelado' && U.month(r.dueDate || r.effDate) === m), r => r.orig);
  const a = dm(curM), b = dm(prevM); if (b > 0 && a > b * 1.2) add('warn', 'Aumento de despesas', `Despesas previstas de ${U.monthLabel(curM)} (${U.money(a)}) estão ${U.pct((a - b) / b)} acima de ${U.monthLabel(prevM)} (${U.money(b)}).`, null);
  if (!S.settings.mappingValidated) add('info', 'Contas bancárias não validadas', 'O tipo e a condição de disponível de cada conta foram sugeridos pelo nome. Confirme em Configurações.', null);
  const ord = { bad: 0, warn: 1, info: 2 }; return out.sort((x, y) => ord[x.sev] - ord[y.sev]);
}

  html += `<div class="card"><h3>Lançamentos com pendência</h3><p class="small">Clique para ver o lançamento e fazer um ajuste manual (CNPJ, classe de folha, nota). O ajuste não altera o relatório e fica no backup.</p><div id="tbl"></div></div>`;

}

async function loadFiles(files) {
  if (!files.length) return;
  $('#imp-msg').innerHTML = '<p>Lendo arquivo(s)…</p>';
  const parsed = []; const errs = [];
  for (const f of files) {
    try { const p = await readFileRows(f); if (p.headerIdx < 0) errs.push(f.name + ': não encontrei a linha de cabeçalho (verifique se é o extrato financeiro do Conta Azul).'); parsed.push(p); }
    catch (e) { errs.push(f.name + ': erro de leitura (' + e.message + ')'); }
  }
  const mapping = {};
  for (const p of parsed) if (p.headerIdx >= 0) mapping[p.fileName] = suggestMapping(p.rows[p.headerIdx]);
  S.imp = { files: parsed.filter(p => p.headerIdx >= 0), errs, mapping, label: 'Atualização de ' + U.br(U.today()) };
  rebuildImport();
  render();
}
function rebuildImport() {
  const I = S.imp; if (!I.files.length) { I.built = null; return; }
  I.mapping.__default = I.mapping[I.files[0].fileName];
  I.built = buildRecords(I.files, I.mapping, S.settings);
  I.diag = diagnose(I.files, I.mapping, I.built, S.settings, S.ui.base);
  // validação de estrutura
  const errors = [], warns = [];
  for (const p of I.files) {
    const m = I.mapping[p.fileName];
    for (const f of FIELDS.filter(f => f.req)) if (m[f.id] == null) errors.push(p.fileName + ': coluna obrigatória não mapeada: ' + f.label);
    if (m.dtVenc == null && m.dtPrev == null && m.dtPag == null) errors.push(p.fileName + ': nenhuma coluna de data mapeada');
  }
  if (!I.built.records.length) errors.push('Nenhum lançamento lido.');
  const recsE = enrich(I.built.records, S.settings, S.ui.base);
  const nVal = recsE.filter(r => r.pend.some(p => !/Sem centro de custo/.test(p))).length;
  const pv = activeVersion();
  if (pv && I.built.records.length < pv.records.length * 0.5) warns.push(`O novo arquivo tem ${I.built.records.length} lançamentos; a base atual tem ${pv.records.length}. Confira se a exportação não veio filtrada (período ou conta).`);
  if (pv) { const cols0 = (pv.headers || []).join('|'), cols1 = (I.files[0].rows[I.files[0].headerIdx] || []).map(P.text).join('|'); if (cols0 && cols0 !== cols1) warns.push('O layout de colunas mudou em relação à importação anterior. Confira o mapeamento abaixo.'); }
  const dts = recsE.map(r => r.dueDate || r.effDate).filter(Boolean).sort();
  if (dts.length && dts[dts.length - 1] < S.ui.base) warns.push('O arquivo não tem lançamentos futuros. Para projetar o caixa, exporte também as datas futuras.');
  // cobertura: contas esperadas e período em relação à versão anterior
  const contasNovas = new Set(recsE.map(r => r.conta).filter(Boolean));
  const faltam = Object.keys(S.settings.accounts).filter(a => !contasNovas.has(a));
  const sugRen = renameSuggestions(S.settings, [...contasNovas]);
  if (sugRen.length) warns.push('Possível conta renomeada no Conta Azul: ' + sugRen.map(x => '"' + x.old + '" → "' + x.novo + '"').join('; ') + '. Depois de importar, confirme em Configurações → Contas renomeadas para manter CNPJ, validação, saldo do banco e conciliação.');
  const faltam2 = faltam.filter(a => !sugRen.some(x => x.old === a));
  if (faltam2.length) warns.push('Contas cadastradas sem nenhum lançamento neste arquivo: ' + faltam2.join(', ') + '. Confira se a exportação incluiu todas as contas.');
  if (pv) {
    const pd = enrich(pv.records, S.settings, S.ui.base).map(r => r.dueDate || r.effDate).filter(Boolean).sort();
    if (pd.length && dts.length && dts[0] > pd[0]) warns.push(`O novo arquivo começa em ${U.br(dts[0])}; a versão anterior começava em ${U.br(pd[0])}. Lançamentos antigos vão aparecer como "desapareceram" no comparativo (a versão anterior continua guardada).`);
    if (pd.length && dts.length && dts[dts.length - 1] < pd[pd.length - 1]) warns.push(`O novo arquivo termina em ${U.br(dts[dts.length - 1])}; a versão anterior ia até ${U.br(pd[pd.length - 1])}. Confira o filtro de período da exportação.`);
  }
  const orf = orphanManual(S.settings, recsE);
  if (orf.length) warns.push(orf.length + ' ajuste(s) manual(is) não encontram o lançamento neste arquivo. Eles não serão apagados; depois da importação, reassocie em Pendências.');
  I.coverage = { de: dts[0], ate: dts[dts.length - 1], contas: [...contasNovas] };
  I.errors = errors; I.warns = warns; I.nVal = nVal; I.recsE = recsE;
}
function importPreviewHtml() {

    <div class="mapgrid">${FIELDS.map(f => { const m = I.mapping[p0.fileName][f.id]; return `<label class="${f.req && m == null ? 'bad-t' : ''}">${f.label}${f.req ? ' *' : ''}<select data-map="${f.id}"><option value="">(não usar)</option>${headers.map((x, j) => `<option value="${j}" ${m === j ? 'selected' : ''}>${U.esc(x || 'coluna ' + (j + 1))}</option>`).join('')}</select></label>`; }).join('')}</div></div>`;

function bindImport() {
  if (!S.imp || !S.imp.files.length) return;
  $$('[data-map]').forEach(s => s.onchange = () => { const m = S.imp.mapping[S.imp.files[0].fileName]; if (s.value === '') delete m[s.dataset.map]; else m[s.dataset.map] = +s.value; rebuildImport(); render(); });
  const lab = $('#imp-label'); if (lab) lab.oninput = () => S.imp.label = lab.value;
  const ok = $('#imp-ok'); if (ok) ok.onclick = confirmImport;
  const cc = $('#imp-cancel'); if (cc) cc.onclick = () => { S.imp = null; render(); };
  const dg = $('#imp-diag'); if (dg) dg.onclick = () => exportDiag(S.imp.diag);
}
async function confirmImport() {
  const I = S.imp; if (!I || I.errors.length) return;
  // contas novas entram na configuração com a sugestão (não validada)
  for (const r of I.built.records) { const c = aliasOf(r.conta, S.settings); if (c && !S.settings.accounts[c]) S.settings.accounts[c] = { cnpj: guessCnpj(c), type: guessAcctType(c), validated: false }; }
  for (const [k, v] of Object.entries(I.mapping)) if (k !== '__default') S.settings.lastMapping = v;
  const at = Date.now();
  const v = { id: U.uid(), at, label: I.label || 'Atualização ' + U.dt(at), base: S.ui.base, files: I.files.map(f => ({ name: f.fileName, size: f.size, sheet: f.sheetName, rows: f.rows.length })), headers: (I.files[0].rows[I.files[0].headerIdx] || []).map(P.text), records: I.built.records, ignored: I.built.ignored.length, mapping: I.mapping };
  // fotografia da projeção no momento da importação (para comparar depois)
  const all = enrich(v.records, S.settings, S.ui.base); const bal = accountBalances(all, S.settings, S.ui.base);
  v.snapshot = {};
  for (const c of ['C', '52', '20']) { const p = project(all, S.settings, S.ui.base, c, { balances: bal, days: 120 }); const eom = p.days.find(d => d.d === U.endOfMonth(S.ui.base)); v.snapshot[c] = { base: S.ui.base, start: p.start.total, eom: eom ? eom.fim : null, firstNeg: p.firstNeg ? p.firstNeg.d : null, min: p.minBal.v, minD: p.minBal.d, d30: (p.days[30] || {}).fim, ar: U.sum(byCnpj(all, c).filter(r => r.open && r.k === 'receita'), r => r.openAmt), ap: U.sum(byCnpj(all, c).filter(r => r.open && r.k === 'despesa'), r => r.openAmt) }; }
  S.versions.push(v); S.activeId = v.id; S.imp = null;
  await saveSettings(); await saveVersions();
  toast('Versão salva: ' + v.records.length + ' lançamentos');
  go('painel');
}
function versionsHtml() {
  if (!S.versions.length) return '<p class="small">Nenhuma versão importada.</p>';
  return stable([{ l: 'Versão', f: v => `<b>${U.esc(v.label)}</b>${v.id === S.activeId ? ' <span class="tag ok">ativa</span>' : ''}` }, { l: 'Importada em', f: v => U.dt(v.at) }, { l: 'Arquivo(s)', f: v => v.files.map(f => U.esc(f.name)).join('<br>') }, { l: 'Lanç.', n: true, f: v => v.records.length },
    { l: 'Saldo inicial (consol.)', n: true, f: v => v.snapshot ? U.money(v.snapshot.C.start) : '—' }, { l: 'Fim do mês projetado', n: true, f: v => v.snapshot ? U.money(v.snapshot.C.eom) + ' <span class="small">(' + U.br(U.endOfMonth(v.snapshot.C.base)) + ')</span>' : '—' }, { l: 'Risco', f: v => v.snapshot ? (v.snapshot.C.firstNeg ? `<span class="neg">${U.br(v.snapshot.C.firstNeg)}</span>` : 'nenhum') : '—' },
    { l: '', f: v => `<button class="btn sm" onclick="setActive('${v.id}')">Ativar</button> <button class="btn sm" onclick="delVersion('${v.id}')">Excluir</button>` }], [...S.versions].reverse());
}
async function setActive(id) { S.activeId = id; await saveVersions(); render(); toast('Versão ativada'); }
async function delVersion(id) {
  const v = S.versions.find(x => x.id === id); if (!v) return;
  const usedBy = (S.settings.fechamentos || []).filter(f => f.versao && f.versao.id === id).length;
  if (!confirm('Excluir a versão "' + v.label + '"? O histórico de importações perde esta versão (o comparativo deixa de poder usá-la).' + (usedBy ? ' Ela é a base de ' + usedBy + ' fechamento(s) registrado(s); o fechamento continua guardado, mas sem a versão original.' : '') + ' Faça um backup antes.')) return;
  S.versions = S.versions.filter(x => x.id !== id); if (S.activeId === id) S.activeId = S.versions.length ? S.versions[S.versions.length - 1].id : null;
  await saveVersions(); render();
}
function exportDiag(D) {
  const wb = XLSX.utils.book_new();
  const add = (n, rows) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ '-': 'sem dados' }]), n);
  add('Resumo', [{ Item: 'Lançamentos', Valor: D.n }, { Item: 'Colunas', Valor: D.columns.length }, { Item: 'Período', Valor: D.period ? U.br(D.period[0]) + ' a ' + U.br(D.period[1]) : '' }, { Item: 'Linhas ignoradas', Valor: D.ignored }, { Item: 'Campos sem coluna', Valor: D.missing.join(', ') }]);
  add('Colunas', D.columns.map(c => ({ Coluna: c.h, Campo: c.field, Preenchimento: U.r2(c.pct * 100) + '%', Distintos: c.distinct, Exemplos: c.sample.join(' | ') })));
  add('Situacao', D.situacao.map(x => ({ Situacao: x.k, Lancamentos: x.n, Soma: x.valor, Interpretacao: x.norm })));
  add('Tipo', D.tipo.map(x => ({ Tipo: x.k, Lancamentos: x.n, Soma: x.valor, Interpretacao: x.norm })));
  if (D.origem) add('Origem', D.origem.map(x => ({ Origem: x.k, Lancamentos: x.n, Soma: x.valor, Interpretacao: x.norm })));
  add('Contas', D.conta.map(x => ({ Conta: x.k, Lancamentos: x.n, CNPJ: x.cnpj, Tipo: x.type })));
  add('Meses', D.mes.map(x => ({ Mes: x[0], Lancamentos: x[1] })));
  add('Inconsistencias', D.issues.map(i => ({ Tipo: i.tipo, Detalhe: i.txt, Linhas: i.recs.map(r => r.line).join(', ') })));
  XLSX.writeFile(wb, 'diagnostico_extrato_conta_azul.xlsx');
}

  if (arV.length) rec.push(`Cobrar ${arV.length} recebível(is) vencido(s) (${U.money(U.sum(arV, r => r.openAmt))}): ${arV.slice(0, 3).map(r => r.pessoa).join(', ')}.`);
  if (issues.some(i => /duplicidade/.test(i.tipo))) rec.push('Revisar as possíveis duplicidades apontadas em Pendências.');

  if (R.some(r => !r.conta && r.k !== 'saldo')) rec.push(`Informar a conta bancária dos ${R.filter(r => !r.conta && r.k !== 'saldo').length} lançamento(s) sem conta.`);

  };

};

async function doBackup() {
  const obj = { app: 'luanda-caixa-cm', appVersion: APP_VERSION, exportedAt: new Date().toISOString(), settings: S.settings, versions: S.versions, activeId: S.activeId };
  download('backup_luanda_caixa_' + U.today() + '.json', new Blob([JSON.stringify(obj)], { type: 'application/json' }));
  S.settings.lastBackupAt = Date.now(); await Store.set('settings', S.settings); toast('Backup gerado');
}

/* ---------- inicialização ---------- */
async function loadState() {
  const st = await Store.get('settings');
  S.settings = Object.assign(defaultSettings(), st || {});
  if (st) S.settings.schema = st.schema; // configuração de versão anterior não tem schema: a migração precisa rodar
  const notes = st ? migrateSettings(S.settings) : [];
  if (notes.length) { await Store.set('settings', S.settings); setTimeout(() => toast('Configurações atualizadas para a versão ' + APP_VERSION + ': ' + notes.length + ' ajuste(s) (ver Cenários)'), 600); }
  S.versions = (await Store.get('versions')) || [];
  S.activeId = (await Store.get('activeId')) || (S.versions.length ? S.versions[S.versions.length - 1].id : null);
  S.cache = null;
}
async function init() {
  await Store.open();
  try { await loadState(); } catch (e) { console.error(e); Store.remoteErr = 'Erro ao ler a base da CM: ' + (e.message || e.code || e); S.settings = S.settings || defaultSettings(); S.versions = S.versions || []; }
  Store.onRemoteChange = async () => { try { await loadState(); render(); toast('Dados atualizados na base da CM'); } catch (e) { console.error(e); } };
  $('#base-date').onchange = e => {
    if (!e.target.value) return;

    S.ui.base = e.target.value === hoje.slice(0, 7) ? hoje : U.endOfMonth(e.target.value + '-01');

  const h = location.hash.slice(1); if (NAV.some(n => n[0] === h)) S.ui.view = h; else if (!S.versions.length) S.ui.view = 'importacao';
  render();
}

      <div class="hi"><div class="hl">Pago</div><div class="hv">${U.money(st.desp)}</div></div>

function svgInline(svgEl) {
  const clone = svgEl.cloneNode(true);
  const srcEls = svgEl.querySelectorAll('*'), dstEls = clone.querySelectorAll('*');
  const copy = (src, dst) => { const cs = getComputedStyle(src); ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'font-size', 'font-weight', 'font-family', 'text-anchor'].forEach(p => { const v = cs.getPropertyValue(p); if (v) dst.style.setProperty(p, v); }); };
  copy(svgEl, clone);
  srcEls.forEach((src, i) => copy(src, dstEls[i]));
  return clone;
}
function svgToPng(svgEl, scale) {
  return new Promise((resolve, reject) => {
    const clone = svgInline(svgEl);
    const vb = svgEl.viewBox.baseVal;
    const w = (vb && vb.width) || svgEl.clientWidth || 640, h = (vb && vb.height) || svgEl.clientHeight || 260;
    clone.setAttribute('width', w); clone.setAttribute('height', h);
    const xml = new XMLSerializer().serializeToString(clone);
    const img = new Image();
    img.onload = () => {
      const s = scale || 2, canvas = document.createElement('canvas');
      canvas.width = w * s; canvas.height = h * s;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.scale(s, s); ctx.drawImage(img, 0, 0, w, h);
      resolve({ dataUrl: canvas.toDataURL('image/png'), w, h });
    };
    img.onerror = reject;
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
  });
}
async function chartToPng(chartHtml) {
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-9999px;top:0;background:#fff';
  holder.innerHTML = chartHtml;
  document.body.appendChild(holder);
  const svgEl = holder.querySelector('svg');
  let out = null;
  if (svgEl) { try { out = await svgToPng(svgEl); } catch (e) { console.warn(e); } }
  document.body.removeChild(holder);
  return out;
}

    const pendN = data().all.filter(r => inM(r) && r.pend.some(p => !/Sem centro de custo/.test(p))).length;
    const saldosCash = st.saldos.filter(b => b.cash);
    const saldosOk = saldosCash.filter(b => b.banco != null && !b.diff).length;
    s.addTable([
      ['Pendências de validação', String(pendN)],
      ['Em aberto (vencidos até o fim do mês)', st.nAbertosVenc + ' · a receber ' + U.money(st.abertosRec) + ' · a pagar ' + U.money(st.abertosDesp)],
      ['Saldos bancários conferidos', saldosOk + ' de ' + saldosCash.length],
    ], { x: 0.4, y: 1.3, w: 9.0, fontSize: 13, border: { type: 'solid', color: line, pt: 0.5 }, color: ink });

    await pptx.writeFile({ fileName: 'fechamento_luanda_' + ym + '.pptx' });
  } catch (e) {
    console.error(e); toast('Não foi possível gerar o PPT: ' + (e.message || e), true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = prevLabel; }
  }
}

</script>
